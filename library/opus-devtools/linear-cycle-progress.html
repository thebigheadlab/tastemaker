<!doctype html>
<html><head><meta charset="utf-8"><title>Cycle progress</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#f4f4f6;color:#1b1c1f;font:13px/1.4 Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;align-items:center;justify-content:center}
svg{display:block;flex:none}
.p{width:416px;height:552px;background:#fff;border:1px solid #e3e4e8;border-radius:10px;box-shadow:0 1px 2px rgba(16,17,26,.04),0 4px 14px rgba(16,17,26,.05);padding:18px 20px;display:flex;flex-direction:column}
.h{display:flex;align-items:center;gap:8px}
.h .ic{width:22px;height:22px;border-radius:6px;background:#eef0fd;display:grid;place-items:center}
.h b{font-weight:600;font-size:14px}
.h .cur{font-size:11.5px;font-weight:500;color:#5e6ad2;background:#eef0fd;padding:2px 7px;border-radius:5px}
.h .more{margin-left:auto;color:#8a8f98}
.dates{color:#6b6f76;font-size:12.5px;margin:6px 0 16px;display:flex;gap:6px;align-items:center}
.dates i{font-style:normal;color:#b0b3b9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #ebebef;border-radius:8px;overflow:hidden}
.st{padding:9px 12px}
.st+.st{border-left:1px solid #ebebef}
.st .l{display:flex;align-items:center;gap:6px;font-size:12px;color:#6b6f76}
.st .l:before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.st .v{font-size:15px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.st .v small{font-size:12px;font-weight:500;color:#8a8f98;margin-left:4px}
.chart{margin:14px 0 4px;position:relative}
.ax{display:flex;justify-content:space-between;font-size:11px;color:#9a9ea5;padding:4px 0 0 26px}
.tabs{display:flex;gap:2px;margin:16px 0 10px;border-bottom:1px solid #ebebef}
.tab{padding:0 2px 8px;margin-right:16px;font-weight:500;color:#8a8f98;font-size:12.5px;position:relative}
.tab.on{color:#1b1c1f}
.tab.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#1b1c1f;border-radius:1px}
.a{display:flex;align-items:center;gap:10px;height:36px}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#fff;flex:none}
.a .nm{width:104px;font-weight:500;white-space:nowrap}
.bar{flex:1;height:6px;border-radius:3px;background:#efeff2;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.a .pct{width:74px;text-align:right;font-size:12px;color:#6b6f76;font-variant-numeric:tabular-nums}
.a .pct b{color:#1b1c1f;font-weight:500}
</style></head><body>

      <path d="M26 136 L52 136 L78 132 L104 126 L130 118 L156 110 L182 104 L208 96 L234 90 L260 84 L276 81 L276 136 Z" fill="#eef0fd"/>
      <path d="M26 136 L52 136 L78 132 L104 126 L130 118 L156 110 L182 104 L208 96 L234 90 L260 84 L276 81" fill="none" stroke="#5e6ad2" stroke-width="2"/>
      <path d="M276 81 L374 42" fill="none" stroke="#5e6ad2" stroke-width="1.6" stroke-dasharray="4 3" opacity=".7"/>

</div>
</body></html>

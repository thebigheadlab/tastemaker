<!doctype html>
<html><head><meta charset="utf-8"><title>Command bar</title>
<meta name="tastemaker-font-intent" content="Plus Jakarta Sans">
<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:linear-gradient(160deg,#c9b8f5 0%,#b5c3f7 50%,#a9d8f0 100%);color:#1f1a33;font:14px/1.35 "Plus Jakarta Sans",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
svg{display:block;flex:none}
.pg{position:absolute;left:96px;top:10px;right:10px;bottom:10px;background:#fff;border-radius:10px;box-shadow:0 0 0 1px rgba(40,30,90,.08),0 6px 20px rgba(40,30,90,.12);overflow:hidden;filter:blur(1.5px);opacity:.85}
.pg i{display:block;height:10px;border-radius:5px;background:#eeecf5;margin:14px 24px}
.side{position:absolute;left:10px;top:44px;width:76px}
.side i{display:block;height:24px;border-radius:7px;background:rgba(255,255,255,.35);margin-bottom:6px}
.scrim{position:absolute;inset:0;background:rgba(40,30,80,.12)}
.cb{position:absolute;left:50%;top:56px;transform:translateX(-50%);width:520px;background:rgba(255,255,255,.97);border-radius:16px;box-shadow:0 0 0 1px rgba(40,30,90,.08),0 24px 60px rgba(40,30,90,.28),0 4px 12px rgba(40,30,90,.1);overflow:hidden}
.in{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #efedf4;font-size:17px}
.in .ty{color:#1f1a33;font-weight:500}
.in .sug{color:#a59fb8}
.in .sug b{background:#d9cffb;color:#1f1a33;font-weight:500;border-radius:3px;padding:0 1px}
.in svg{color:#8b84a3}
.list{padding:8px}
.h{font-size:11.5px;font-weight:700;color:#8b84a3;padding:8px 10px 4px;letter-spacing:.02em}
.it{height:42px;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 10px;font-size:14px;color:#1f1a33}
.it.on{background:#7c5cf0;color:#fff}
.it.on .sub,.it.on .k{color:rgba(255,255,255,.8)}
.it.on .k kbd{background:rgba(255,255,255,.2);color:#fff}
.fi{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none}
.it .sub{color:#8b84a3;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .k{margin-left:auto;display:flex;gap:6px;align-items:center;color:#8b84a3;font-size:12.5px;white-space:nowrap}
kbd{font:600 11px "Plus Jakarta Sans",sans-serif;height:20px;min-width:20px;padding:0 5px;border-radius:5px;background:#f1eff7;color:#6b6585;display:inline-grid;place-items:center}
.it svg{color:#8b84a3}
.it.on svg{color:#fff}
</style></head><body>
<div class="side"><i></i><i></i><i style="background:rgba(255,255,255,.75)"></i><i></i><i></i></div>
<div class="pg"><i style="width:30%;margin-top:28px;height:14px"></i><i style="width:80%"></i><i style="width:70%"></i><i style="width:76%"></i><i style="width:50%"></i></div>
<div class="scrim"></div>
<div class="cb">
  <div class="in"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3" stroke-linecap="round"/></svg><span><span class="ty">fig</span><span class="sug"><b>tree.app/file/launch-v3</b></span></span></div>
  <div class="list">
    <div class="it on"><span class="fi" style="background:#f24e1e">✦</span>Launch page — v3 mocks<span class="sub">— Switch to Tab</span><span class="k"><kbd>↵</kbd></span></div>
    <div class="it"><span class="fi" style="background:#2f4a3a">F</span>Figure sizing guidelines<span class="sub">fieldnotes.studio/docs</span></div>
    <div class="h">Search</div>
    <div class="it"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3" stroke-linecap="round"/></svg><span>fig<b style="font-weight:600"> and goat cheese tart</b></span></div>
    <div class="it"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3" stroke-linecap="round"/></svg><span>fig<b style="font-weight:600"> tree care in pots</b></span></div>
    <div class="h">Actions</div>
    <div class="it"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M8 3v10"/></svg>Add Split View<span class="k"><kbd>⌃</kbd><kbd>⇧</kbd><kbd>=</kbd></span></div>
    <div class="it"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>Copy URL<span class="k"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>C</kbd></span></div>
  </div>
</div>
</body></html>

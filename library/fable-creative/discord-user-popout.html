<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>User profile popout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
  html,body{margin:0;height:100%}
  body{width:480px;height:600px;overflow:hidden;background:#313338;font-family:"Nunito Sans","Figtree",system-ui,sans-serif;font-size:14px;color:#dbdee1;position:relative;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
  *{box-sizing:border-box}
  .pop{width:340px;background:#111214;border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);position:relative}
  .banner{height:100px;background:linear-gradient(135deg,#0e3b2a 0%,#23a559 55%,#b8f5c8 100%);position:relative;overflow:hidden}
  .banner svg{position:absolute;right:-10px;bottom:-10px;opacity:.5}
  .avwrap{position:absolute;left:16px;top:56px;width:92px;height:92px;border-radius:50%;background:#111214;display:flex;align-items:center;justify-content:center}
  .av{width:80px;height:80px;border-radius:50%;background:#23a559;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;position:relative}
  .st{position:absolute;right:0;bottom:0;width:24px;height:24px;border-radius:50%;background:#23a559;border:6px solid #111214}
  .badges{position:absolute;right:16px;top:112px;display:flex;gap:4px;background:#1e1f22;border-radius:8px;padding:4px}
  .badges i{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center}
  .body{padding:54px 16px 14px}
  .card{background:#1e1f22;border-radius:8px;padding:12px}
  .name{font-size:20px;font-weight:800;color:#f2f3f5;line-height:1.2}
  .handle{font-size:14px;color:#dbdee1}
  .pron{font-size:13px;color:#b5bac1;margin-top:2px}
  .status{margin-top:10px;font-size:14px;color:#dbdee1;display:flex;align-items:center;gap:6px}
  hr{border:none;border-top:1px solid #2e2f34;margin:10px 0}
  h6{margin:0 0 6px;font-size:12px;font-weight:700;color:#f2f3f5;text-transform:uppercase;letter-spacing:.2px}
  .about{font-size:14px;line-height:1.4;color:#dbdee1}
  .roles{display:flex;flex-wrap:wrap;gap:4px}
  .role{display:inline-flex;align-items:center;gap:6px;background:#2b2d31;border-radius:4px;padding:3px 8px 3px 6px;font-size:12px;font-weight:600;color:#dbdee1}
  .role i{width:12px;height:12px;border-radius:50%;display:block}
  .act{display:flex;gap:10px;align-items:center}
  .act .ico{width:40px;height:40px;border-radius:8px;background:#5b3df5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .act b{display:block;font-size:13px;color:#f2f3f5}
  .act span{display:block;font-size:12px;color:#b5bac1}
  .msg{margin-top:10px;height:36px;border-radius:4px;background:#111214;border:1px solid #2e2f34;display:flex;align-items:center;padding:0 12px;color:#6d6f78;font-size:14px}
  .btn{margin-top:10px;height:36px;border-radius:4px;background:#5865f2;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
</style>
</head>
<body>
  <div class="pop">
    <div class="banner">
      <svg width="140" height="140" viewBox="0 0 140 140"><g fill="#fff"><rect x="10" y="10" width="20" height="20"/><rect x="50" y="10" width="20" height="20"/><rect x="30" y="30" width="20" height="20"/><rect x="70" y="30" width="20" height="20"/><rect x="10" y="50" width="20" height="20"/><rect x="50" y="50" width="20" height="20"/><rect x="90" y="50" width="20" height="20"/><rect x="30" y="70" width="20" height="20"/><rect x="70" y="70" width="20" height="20"/><rect x="110" y="70" width="20" height="20"/><rect x="50" y="90" width="20" height="20"/><rect x="90" y="90" width="20" height="20"/></g></svg>
    </div>
    <div class="avwrap"><div class="av">K<span class="st"></span></div></div>
    <div class="badges">
      <i><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1l2 4.2 4.6.6-3.3 3.2.8 4.6L8 11.4 3.9 13.6l.8-4.6L1.4 5.8 6 5.2z" fill="#f0b232"/></svg></i>
      <i><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1l6 3v4c0 3.5-2.6 6.2-6 7-3.4-.8-6-3.5-6-7V4z" fill="#5865f2"/><path d="M5.5 8l2 2 3-3.5" fill="none" stroke="#fff" stroke-width="1.4"/></svg></i>
      <i><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2" fill="#eb459e"/><path d="M5 8h6M8 5v6" stroke="#fff" stroke-width="1.4"/></svg></i>
    </div>
    <div class="body">
      <div class="card">
        <div class="name">kiro</div>
        <div class="handle">kiro.exe</div>
        <div class="pron">they/them</div>
        <div class="status">🟢 shader goblin · ships at 3am</div>
        <hr>
        <h6>About me</h6>
        <div class="about">pixel art, GDScript, obsessed with dithering. jam organizer @ Pixel Forge 👾</div>
        <hr>
        <h6>Roles</h6>
        <div class="roles"><span class="role"><i style="background:#23a559"></i>Jam Lead</span><span class="role"><i style="background:#eb459e"></i>Artist</span><span class="role"><i style="background:#5865f2"></i>Shader Wizard</span><span class="role"><i style="background:#f0b232"></i>Booster</span><span class="role" style="color:#b5bac1">+2</span></div>
        <hr>
        <h6>Playing a game</h6>
        <div class="act"><div class="ico"><svg width="22" height="22" viewBox="0 0 22 22" fill="#fff"><rect x="3" y="3" width="4" height="4"/><rect x="11" y="3" width="4" height="4"/><rect x="7" y="7" width="4" height="4"/><rect x="15" y="7" width="4" height="4"/><rect x="3" y="11" width="4" height="4"/><rect x="11" y="11" width="4" height="4"/><rect x="7" y="15" width="4" height="4"/></svg></div><div><b>Aseprite</b><span>Editing fog_tiles.ase</span><span>2 hours 14 minutes elapsed</span></div></div>
        <div class="msg">Message @kiro</div>
      </div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Course card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
  html,body{margin:0;height:100%}
  body{width:480px;height:600px;overflow:hidden;background:#f6efe6;font-family:"Figtree","Plus Jakarta Sans",system-ui,sans-serif;color:#2d2b27;display:flex;align-items:center;justify-content:center}
  *{box-sizing:border-box}
  .card{width:340px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px rgba(45,43,39,.08)}
  .art{height:220px;position:relative;overflow:hidden;background:#5b8def}
  .tag{position:absolute;left:18px;top:18px;background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;letter-spacing:.3px}
  .body{padding:20px 22px 22px}
  .body h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
  .body p{margin:8px 0 0;font-size:14px;line-height:1.5;color:#6f685e;font-weight:500}
  .meta{display:flex;gap:14px;margin-top:16px;font-size:13px;font-weight:700;color:#2d2b27}
  .meta span{display:flex;align-items:center;gap:6px}
  .prog{margin-top:18px;display:flex;align-items:center;gap:12px}
  .bar{flex:1;height:8px;border-radius:4px;background:#efe8dd;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#f47d31;border-radius:4px}
  .prog b{font-size:13px;font-weight:800}
  .btn{margin-top:18px;height:52px;border-radius:999px;background:#2d2b27;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
</style>
</head>
<body>
  <div class="card">
    <div class="art">
      <svg width="340" height="220" viewBox="0 0 340 220">
        <circle cx="270" cy="50" r="40" fill="#ffd166"/>
        <path d="M-10 160c60-50 120-50 170-20s110 30 190-10v100H-10z" fill="#3d6bd1"/>
        <path d="M-10 190c80-40 160-20 230 0s90 10 130-10v50H-10z" fill="#2c54b0"/>
        <!-- two blob friends -->
        <path d="M110 170c0-32 18-56 46-56s46 24 46 56c0 18-16 28-46 28s-46-10-46-28z" fill="#f3b8c6"/>
        <circle cx="146" cy="150" r="3.5" fill="#2d2b27"/><circle cx="166" cy="150" r="3.5" fill="#2d2b27"/>
        <path d="M149 164c4 4 10 4 14 0" fill="none" stroke="#2d2b27" stroke-width="3" stroke-linecap="round"/>
        <path d="M200 186c0-20 12-36 30-36s30 16 30 36c0 10-10 16-30 16s-30-6-30-16z" fill="#ffb169"/>
        <circle cx="224" cy="172" r="3" fill="#2d2b27"/><circle cx="238" cy="172" r="3" fill="#2d2b27"/>
        <path d="M226 182c3 3 7 3 10 0" fill="none" stroke="#2d2b27" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="40" cy="40" r="2" fill="#fff" opacity=".7"/><circle cx="80" cy="90" r="1.5" fill="#fff" opacity=".7"/><circle cx="200" cy="30" r="1.5" fill="#fff" opacity=".7"/>
      </svg>
      <span class="tag">COURSE</span>
    </div>
    <div class="body">
      <h3>Managing anxiety</h3>
      <p>Learn to notice anxious thoughts without getting swept away by them. Ten short sessions with Eve.</p>
      <div class="meta">
        <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1.5"/></svg>10 min</span>
        <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M5 1.5v3M11 1.5v3M2 7h12"/></svg>10 sessions</span>
        <span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="6" r="3"/><path d="M2.5 14a5.5 5.5 0 0 1 11 0"/></svg>Eve</span>
      </div>
      <div class="prog"><div class="bar"><i></i></div><b>4 of 10</b></div>
      <div class="btn"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 1.5l9 5.5-9 5.5z" fill="#fff"/></svg>Continue session 5</div>
    </div>
  </div>
</body>
</html>

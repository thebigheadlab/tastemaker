<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson path</title>
<meta name="tastemaker-font-intent" content="Nunito">
<style>
  html,body{margin:0;height:100%}
  body{width:390px;height:844px;overflow:hidden;background:#fff;font-family:"Nunito","Nunito Sans",system-ui,sans-serif;color:#4b4b4b;position:relative}
  *{box-sizing:border-box}
  .status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:800;font-size:15px;color:#3c3c3c}
  .status .sig{display:flex;gap:6px;align-items:center}
  .topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .stat{display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px}
  .unit{margin:6px 16px 0;background:#58cc02;border-radius:16px;padding:14px 18px;color:#fff;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 0 #46a302}
  .unit small{display:block;font-size:13px;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.6px}
  .unit b{display:block;font-size:19px;font-weight:900;margin-top:2px}
  .unit .guide{border-left:2px solid rgba(255,255,255,.4);padding-left:14px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
  .path{position:absolute;left:0;right:0;top:230px;height:520px}
  .node{position:absolute;width:70px;height:64px;border-radius:50%/50%;display:flex;align-items:center;justify-content:center}
  .node svg{width:32px;height:32px}
  .node.done{background:#58cc02;box-shadow:0 8px 0 #46a302}
  .node.active{background:#58cc02;box-shadow:0 8px 0 #46a302}
  .node.locked{background:#e5e5e5;box-shadow:0 8px 0 #afafaf}
  .node.chest{background:transparent;box-shadow:none}
  .node.chest svg{width:64px;height:56px}
  .ring{position:absolute;width:92px;height:92px;border-radius:50%;border:8px solid #e5e5e5;border-top-color:#58cc02;border-right-color:#58cc02;left:-11px;top:-8px}
  .start{position:absolute;background:#fff;border:2px solid #e5e5e5;border-radius:12px;padding:8px 14px;font-weight:900;color:#58cc02;font-size:15px;letter-spacing:.6px;text-transform:uppercase;animation:bob 1.2s ease-in-out infinite}
  .start:after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2px solid #e5e5e5;border-bottom:2px solid #e5e5e5;transform:translateX(-50%) rotate(45deg)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .mascot{position:absolute;right:22px;top:430px}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;border-top:2px solid #e5e5e5;background:#fff;display:flex;justify-content:space-around;align-items:flex-start;padding:10px 10px 0}
  .tab{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center}
  .tab.on{border:2px solid #84d8ff;background:#ddf4ff}
  .tab svg{width:32px;height:32px}
  .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000}
</style>
</head>
<body>
  <div class="status"><span>9:41</span><span class="sig">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#3c3c3c"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#3c3c3c"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#3c3c3c"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#3c3c3c"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#3c3c3c"/><rect x="2" y="2" width="19" height="8" rx="2" fill="#3c3c3c"/><rect x="24" y="4" width="2" height="4" rx="1" fill="#3c3c3c"/></svg></span></div>
  <div class="topbar">
    <div class="stat"><svg width="30" height="22" viewBox="0 0 30 22"><rect width="30" height="22" rx="4" fill="#ffcd00"/><rect y="7" width="30" height="8" fill="#0056a7"/><rect x="10" width="10" height="22" fill="#ffcd00"/></svg></div>
    <div class="stat" style="color:#ff9600"><svg width="22" height="26" viewBox="0 0 22 26"><path d="M11 0c2 5 9 8 9 15a9 9 0 0 1-18 0c0-4 2-6 3-8 0 3 1 5 3 5 0-5 1-9 3-12z" fill="#ff9600"/><path d="M11 12c1 3 4 4 4 8a4 4 0 0 1-8 0c0-3 2-4 4-8z" fill="#ffc800"/></svg>12</div>
    <div class="stat" style="color:#1cb0f6"><svg width="24" height="22" viewBox="0 0 24 22"><path d="M12 0l12 8-12 14L0 8z" fill="#1cb0f6"/><path d="M12 0l12 8H0z" fill="#49c0f8"/><path d="M6 8h12l-6 10z" fill="#89d9ff" opacity=".7"/></svg>1,240</div>
    <div class="stat" style="color:#ff4b4b"><svg width="24" height="22" viewBox="0 0 24 22"><path d="M12 22S0 14 0 6.5A6.5 6.5 0 0 1 12 3a6.5 6.5 0 0 1 12 3.5C24 14 12 22 12 22z" fill="#ff4b4b"/></svg>5</div>
  </div>
  <div class="unit">
    <div><small>Section 2, Unit 4</small><b>Order at a café</b></div>
    <div class="guide"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h8a3 3 0 0 1 3 3v13H7a3 3 0 0 0-3 3z"/><path d="M15 6h3v13h-3"/></svg>GUIDEBOOK</div>
  </div>

  <div class="path">
    <div class="node done" style="left:160px;top:0"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5L20 7"/></svg></div>
    <div class="node done" style="left:214px;top:92px"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5L20 7"/></svg></div>
    <div class="node active" style="left:120px;top:190px"><div class="ring"></div><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg></div>
    <div class="start" style="left:122px;top:136px">Start</div>
    <div class="node locked" style="left:70px;top:290px"><svg viewBox="0 0 24 24" fill="#afafaf"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg></div>
    <div class="node chest" style="left:120px;top:380px"><svg viewBox="0 0 64 56" width="64" height="56"><rect x="4" y="18" width="56" height="34" rx="6" fill="#b8b8b8"/><rect x="4" y="18" width="56" height="12" fill="#a0a0a0"/><path d="M4 22a10 10 0 0 1 10-10h36a10 10 0 0 1 10 10v2H4z" fill="#cfcfcf"/><rect x="27" y="26" width="10" height="12" rx="2" fill="#7a7a7a"/><circle cx="32" cy="31" r="2" fill="#e5e5e5"/></svg></div>
    <div class="node locked" style="left:170px;top:452px"><svg viewBox="0 0 24 24" fill="#afafaf"><path d="M8 7v4H6v9h12v-9h-2V7a4 4 0 0 0-8 0zm2 4V7a2 2 0 0 1 4 0v4z"/></svg></div>
  </div>

  <!-- mascot: owl-ish bird in CSS/SVG -->
  <div class="mascot">
    <svg width="112" height="124" viewBox="0 0 112 124">
      <ellipse cx="56" cy="118" rx="34" ry="5" fill="#000" opacity=".08"/>
      <path d="M22 60c0-28 15-44 34-44s34 16 34 44v26c0 18-14 30-34 30S22 104 22 86z" fill="#58cc02"/>
      <path d="M30 70c0-20 11-32 26-32s26 12 26 32v18c0 14-10 24-26 24S30 102 30 88z" fill="#89e219"/>
      <circle cx="42" cy="62" r="13" fill="#fff"/><circle cx="70" cy="62" r="13" fill="#fff"/>
      <circle cx="45" cy="64" r="6.5" fill="#4b4b4b"/><circle cx="67" cy="64" r="6.5" fill="#4b4b4b"/>
      <circle cx="47" cy="62" r="2" fill="#fff"/><circle cx="69" cy="62" r="2" fill="#fff"/>
      <path d="M48 80c4-3 12-3 16 0l-8 10z" fill="#ffc200"/>
      <path d="M14 84c6-6 16-6 22 0-8 8-14 10-22 0z" fill="#58cc02"/><path d="M98 84c-6-6-16-6-22 0 8 8 14 10 22 0z" fill="#58cc02"/>
      <path d="M56 16c-6-8-14-12-22-10 4 2 8 6 10 12z" fill="#58cc02"/><path d="M56 16c6-8 14-12 22-10-4 2-8 6-10 12z" fill="#58cc02"/>
      <path d="M44 114l-6 8M68 114l6 8" stroke="#ff9600" stroke-width="6" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="tabbar">
    <div class="tab on"><svg viewBox="0 0 32 32"><path d="M4 16L16 5l12 11v11a2 2 0 0 1-2 2h-6v-8h-8v8H6a2 2 0 0 1-2-2z" fill="#ff9600"/><path d="M16 5l12 11H4z" fill="#ffc800"/></svg></div>
    <div class="tab"><svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="18" rx="4" fill="#ff4b4b"/><rect x="4" y="12" width="24" height="12" fill="#1cb0f6"/><path d="M4 10l24 0" stroke="#fff" stroke-width="0"/><path d="M9 16l5 4 9-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="tab"><svg viewBox="0 0 32 32"><path d="M10 6h12l2 6v8a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6v-8z" fill="#ffc800"/><path d="M8 10H4a3 3 0 0 0 0 6h4M24 10h4a3 3 0 0 1 0 6h-4" fill="none" stroke="#ffc800" stroke-width="3"/><rect x="12" y="26" width="8" height="3" rx="1" fill="#e5a800"/></svg></div>
    <div class="tab"><svg viewBox="0 0 32 32"><path d="M16 2l4 8 9 1-6.5 6 1.5 9-8-4.4L8 26l1.5-9L3 11l9-1z" fill="#1cb0f6"/></svg></div>
    <div class="tab"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#ce82ff"/><circle cx="16" cy="13" r="5" fill="#fff"/><path d="M7 25a9 9 0 0 1 18 0" fill="#fff"/></svg></div>
  </div>
  <div class="homebar"></div>
</body>
</html>

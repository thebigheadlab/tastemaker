<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dot-matrix widgets</title>
<meta name="tastemaker-font-intent" content="Doto"><meta name="tastemaker-font-intent" content="Inter">
<style>
  html,body{margin:0;height:100%}
  body{width:480px;height:600px;overflow:hidden;background:#000;font-family:"Inter",system-ui,sans-serif;color:#fff;position:relative;-webkit-font-smoothing:antialiased;padding:24px}
  *{box-sizing:border-box}
  .dot{font-family:"Doto","Inter",monospace;font-weight:700}
  .g{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .w{background:#1c1c1c;border-radius:24px;padding:18px;position:relative;overflow:hidden;height:160px}
  .w.wide{grid-column:span 2;height:160px}
  .l{font-size:11px;color:#8a8a8a;letter-spacing:.6px;font-weight:500;text-transform:uppercase}
  .v{font-size:56px;line-height:.9;margin-top:10px}
  .sub{font-size:12px;color:#8a8a8a;margin-top:8px;font-weight:500}
  .bat{position:absolute;right:18px;top:18px;width:30px;height:56px;border:2px solid #fff;border-radius:6px;padding:3px}
  .bat:before{content:"";position:absolute;left:8px;top:-7px;width:10px;height:4px;background:#fff;border-radius:2px 2px 0 0}
  .bat i{position:absolute;left:3px;right:3px;bottom:3px;height:78%;background:#fff;border-radius:2px}
  .timer{display:flex;align-items:center;justify-content:space-between;height:100%}
  .timer .ring{width:110px;height:110px;border-radius:50%;background:conic-gradient(#fff 0 62%,#333 62% 100%);position:relative;flex-shrink:0}
  .timer .ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:#1c1c1c}
  .timer .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;z-index:1}
  .timer .ctl{display:flex;gap:10px}
  .timer .ctl span{width:52px;height:52px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center}
  .timer .ctl span.red{background:#d71921}
  .dots{position:absolute;left:18px;right:18px;bottom:16px;display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
  .dots i{height:6px;border-radius:50%;background:#444;display:block}
  .dots i.on{background:#fff}
  .dots i.red{background:#d71921}
  .pedo{display:flex;flex-direction:column;justify-content:space-between;height:100%}
  .bars{display:flex;gap:4px;align-items:flex-end;height:48px}
  .bars i{flex:1;background:#fff;border-radius:2px;display:block}
  .bars i.lo{background:#444}
</style>
</head>
<body>
  <div class="g">
    <div class="w"><div class="l">Battery</div><div class="v dot">78%</div><div class="sub">4h 12m left</div><div class="bat"><i></i></div></div>
    <div class="w"><div class="pedo"><div><div class="l">Steps</div><div class="v dot" style="font-size:44px">7,412</div></div><div class="bars"><i class="lo" style="height:30%"></i><i class="lo" style="height:45%"></i><i class="lo" style="height:25%"></i><i class="lo" style="height:60%"></i><i class="lo" style="height:55%"></i><i class="lo" style="height:80%"></i><i style="height:100%"></i></div></div></div>
    <div class="w wide"><div class="timer"><div class="ring"><b class="dot">12:30</b></div><div><div class="l">Focus timer</div><div class="sub" style="margin-top:4px">Deep work · 20 min block</div></div><div class="ctl"><span><svg width="18" height="18" viewBox="0 0 18 18"><rect x="4" y="3" width="3.5" height="12" fill="#fff"/><rect x="10.5" y="3" width="3.5" height="12" fill="#fff"/></svg></span><span class="red"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" fill="#fff"/></svg></span></div></div></div>
    <div class="w wide" style="height:150px"><div class="l">Weekly screen time</div><div class="v dot" style="font-size:40px">3h 48m <span style="font-size:14px;color:#8a8a8a;font-family:Inter,sans-serif;font-weight:500;letter-spacing:0">avg / day</span></div>
      <div class="dots">
        <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="red"></i><i></i><i></i><i></i><i></i>
        <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="red"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="red"></i><i></i><i></i>
      </div>
    </div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Translate exercise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
  html,body{margin:0;height:100%}
  body{width:480px;height:600px;overflow:hidden;background:#fff;font-family:"Nunito","Nunito Sans",system-ui,sans-serif;color:#4b4b4b;position:relative}
  *{box-sizing:border-box}
  .top{display:flex;align-items:center;gap:14px;padding:22px 24px 0}
  .bar{flex:1;height:16px;border-radius:8px;background:#e5e5e5;overflow:hidden}
  .bar i{display:block;width:58%;height:100%;border-radius:8px;background:#58cc02;position:relative}
  .bar i:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
  .hearts{display:flex;align-items:center;gap:4px;color:#ff4b4b;font-weight:900;font-size:17px}
  h1{font-size:24px;font-weight:900;margin:30px 24px 18px;color:#3c3c3c}
  .prompt{display:flex;align-items:flex-end;gap:12px;padding:0 24px}
  .bubble{border:2px solid #e5e5e5;border-radius:14px;padding:12px 16px;font-size:17px;font-weight:700;position:relative;margin-bottom:10px;line-height:1.3}
  .bubble u{text-decoration:none;border-bottom:2px dotted #afafaf;padding-bottom:1px}
  .bubble:before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:#fff;border-left:2px solid #e5e5e5;border-bottom:2px solid #e5e5e5;transform:rotate(45deg)}
  .speaker{display:inline-flex;width:34px;height:34px;border-radius:9px;background:#1cb0f6;align-items:center;justify-content:center;margin-right:8px;vertical-align:middle;box-shadow:0 3px 0 #1899d6}
  .answer{margin:26px 24px 0;min-height:56px;border-bottom:2px solid #e5e5e5;position:relative;display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px}
  .answer:before{content:"";position:absolute;left:0;right:0;top:-2px;height:2px;background:#e5e5e5}
  .tile{height:46px;padding:0 14px;border:2px solid #e5e5e5;border-bottom-width:4px;border-radius:12px;display:inline-flex;align-items:center;font-size:17px;font-weight:700;color:#4b4b4b;background:#fff}
  .tile.used{color:transparent;background:#e5e5e5;border-color:#e5e5e5}
  .bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:28px 24px 0}
  .foot{position:absolute;left:0;right:0;bottom:0;height:102px;border-top:2px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#fff}
  .ghost{height:50px;padding:0 20px;border:2px solid #e5e5e5;border-bottom-width:4px;border-radius:14px;display:flex;align-items:center;font-weight:900;letter-spacing:.8px;color:#afafaf;font-size:15px}
  .check{height:50px;padding:0 30px;border-radius:14px;background:#58cc02;color:#fff;display:flex;align-items:center;font-weight:900;letter-spacing:.8px;font-size:15px;box-shadow:0 4px 0 #46a302}
</style>
</head>
<body>
  <div class="top">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#afafaf" stroke-width="3" stroke-linecap="round"><path d="M4 4l14 14M18 4L4 18"/></svg>
    <div class="bar"><i></i></div>
    <div class="hearts"><svg width="24" height="22" viewBox="0 0 24 22"><path d="M12 22S0 14 0 6.5A6.5 6.5 0 0 1 12 3a6.5 6.5 0 0 1 12 3.5C24 14 12 22 12 22z" fill="#ff4b4b"/></svg>4</div>
  </div>

  <h1>Write this in English</h1>

  <div class="prompt">
    <svg width="84" height="96" viewBox="0 0 84 96">
      <ellipse cx="42" cy="92" rx="26" ry="4" fill="#000" opacity=".08"/>
      <path d="M14 50c0-22 12-36 28-36s28 14 28 36v18c0 14-11 24-28 24S14 82 14 68z" fill="#58cc02"/>
      <path d="M21 58c0-16 9-26 21-26s21 10 21 26v12c0 11-8 19-21 19S21 81 21 70z" fill="#89e219"/>
      <circle cx="32" cy="50" r="10" fill="#fff"/><circle cx="52" cy="50" r="10" fill="#fff"/>
      <circle cx="34" cy="52" r="5" fill="#4b4b4b"/><circle cx="50" cy="52" r="5" fill="#4b4b4b"/>
      <circle cx="36" cy="50" r="1.6" fill="#fff"/><circle cx="52" cy="50" r="1.6" fill="#fff"/>
      <path d="M36 64c3-2 9-2 12 0l-6 7z" fill="#ffc200"/>
      <path d="M42 14c-5-6-11-9-17-8 3 2 6 5 8 9z" fill="#58cc02"/><path d="M42 14c5-6 11-9 17-8-3 2-6 5-8 9z" fill="#58cc02"/>
    </svg>
    <div class="bubble"><span class="speaker"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></span><u>Quisiera</u> <u>un</u> <u>café</u> <u>con</u> <u>leche,</u> <u>por</u> <u>favor.</u></div>
  </div>

  <div class="answer">
    <span class="tile">I</span><span class="tile">would like</span><span class="tile">a</span><span class="tile">coffee</span>
  </div>

  <div class="bank">
    <span class="tile used">I</span><span class="tile">please</span><span class="tile">milk</span><span class="tile used">coffee</span><span class="tile">tea</span><span class="tile">with</span><span class="tile used">would like</span><span class="tile">the</span><span class="tile used">a</span><span class="tile">sugar</span>
  </div>

  <div class="foot">
    <div class="ghost">SKIP</div>
    <div class="check">CHECK</div>
  </div>
</body>
</html>

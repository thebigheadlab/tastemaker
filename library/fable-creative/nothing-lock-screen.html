<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glyph lock screen</title>
<meta name="tastemaker-font-intent" content="Doto"><meta name="tastemaker-font-intent" content="Inter">
<style>
@font-face{font-family:"Doto";src:url("../fonts/Doto-latin.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
  html,body{margin:0;height:100%}
  body{width:390px;height:844px;overflow:hidden;background:#fff;font-family:"Inter",system-ui,sans-serif;color:#000;position:relative;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  .dot{font-family:"Doto","Inter",monospace;font-weight:700}
  .status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600}
  .time{text-align:center;margin-top:36px}
  .time .t{font-size:110px;line-height:.85;letter-spacing:2px}
  .time .d{font-size:13px;letter-spacing:1.2px;font-weight:500;color:#666;margin-top:14px}
  .glyph{position:absolute;left:50%;top:318px;transform:translateX(-50%) scale(.8);transform-origin:top center;width:200px;height:200px}
  .glyph i{position:absolute;border-radius:999px;background:#000;display:block}
  .glyph .halo{position:absolute;inset:0;border-radius:50%;border:1px dashed #ccc}
  .notifs{position:absolute;left:20px;right:20px;top:500px;display:grid;gap:10px}
  .n{background:#f2f2f2;border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
  .n .ic{width:36px;height:36px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .n .tx{flex:1;min-width:0}
  .n b{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
  .n b small{color:#888;font-weight:500;font-size:11px;font-family:"Doto",monospace}
  .n span{display:block;font-size:13px;color:#444;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bottom{position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:space-between;padding:0 32px;align-items:flex-end}
  .circ{width:52px;height:52px;border-radius:50%;background:#f2f2f2;display:flex;align-items:center;justify-content:center}
  .hint{font-size:11px;letter-spacing:1px;color:#888;font-weight:500;text-align:center}
  .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000}
</style>
</head>
<body>
  <div class="status"><span class="dot" style="font-size:16px">●●●○</span><span style="display:flex;gap:6px;align-items:center">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10"/><rect x="15" y="0" width="3" height="12" fill="#ccc"/></svg>
    <span class="dot" style="font-size:13px">86</span><svg width="22" height="12" viewBox="0 0 22 12"><rect x=".5" y=".5" width="19" height="11" fill="none" stroke="#000"/><rect x="2" y="2" width="14" height="8" fill="#000"/><rect x="20.5" y="4" width="1.5" height="4" fill="#000"/></svg></span></div>

  <div class="time"><div class="t dot">09<br>41</div><div class="d">FRIDAY, 24 OCTOBER</div></div>

  <!-- glyph pattern -->
  <div class="glyph">
    <span class="halo"></span>
    <i style="left:96px;top:0;width:8px;height:40px;animation:none"></i>
    <i style="left:150px;top:22px;width:8px;height:40px;transform:rotate(45deg)"></i>
    <i style="left:160px;top:96px;width:40px;height:8px"></i>
    <i style="left:150px;top:140px;width:8px;height:40px;transform:rotate(-45deg)"></i>
    <i style="left:96px;top:160px;width:8px;height:40px"></i>
    <i style="left:42px;top:140px;width:8px;height:40px;transform:rotate(45deg)"></i>
    <i style="left:0;top:96px;width:40px;height:8px"></i>
    <i style="left:42px;top:22px;width:8px;height:40px;transform:rotate(-45deg)"></i>
    <i style="left:60px;top:60px;width:80px;height:80px;border-radius:50%;background:none;border:8px solid #000"></i>
    <i style="left:88px;top:88px;width:24px;height:24px;border-radius:50%;background:#d71921"></i>
  </div>

  <div class="notifs">
    <div class="n"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg></span><div class="tx"><b>Maya Lindqvist<small>09:38</small></b><span>Running 5 late, order me the usual?</span></div></div>
    <div class="n"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M9 18V6l10 6z"/></svg></span><div class="tx"><b>Now playing<small>02:14</small></b><span>Glass Houses — Parcel Nine</span></div></div>
    <div class="n"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><div class="tx"><b>Design crit<small>10:00</small></b><span>Room 4B · in 19 min</span></div></div>
  </div>

  <div class="bottom">
    <span class="circ"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg></span>
    <span class="hint">SWIPE UP TO UNLOCK</span>
    <span class="circ"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.5"/></svg></span>
  </div>
  <div class="homebar"></div>
</body>
</html>

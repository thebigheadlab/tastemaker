<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Canvas comment thread</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  html,body{margin:0;height:100%}
  body{width:480px;height:600px;overflow:hidden;background:#e5e5e5;font-family:"Inter",system-ui,sans-serif;font-size:12px;color:#1e1e1e;position:relative;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  .frame{position:absolute;left:24px;top:40px;width:200px;height:360px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
  .flabel{position:absolute;top:-16px;left:0;font-size:11px;color:#7a7a7a}
  .pin{position:absolute;width:28px;height:28px;border-radius:14px 14px 14px 2px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .pin .av{width:22px;height:22px;border-radius:50%;color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .pin.active{box-shadow:0 0 0 2px #0d99ff,0 1px 4px rgba(0,0,0,.25)}
  .thread{position:absolute;left:216px;top:120px;width:244px;background:#fff;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
  .th{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 10px 0 12px;border-bottom:1px solid #e6e6e6;color:#999}
  .th .r{display:flex;gap:10px;align-items:center}
  .msg{padding:10px 12px;display:flex;gap:8px}
  .msg .av{width:24px;height:24px;border-radius:50%;flex-shrink:0;color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .msg b{font-weight:600}
  .msg .t{color:#999;margin-left:6px;font-size:11px}
  .msg p{margin:3px 0 0;line-height:1.45}
  .msg .m{color:#0d99ff;font-weight:500}
  .react{display:inline-flex;align-items:center;gap:4px;border:1px solid #e6e6e6;border-radius:999px;padding:2px 7px;margin-top:6px;font-size:11px}
  .reply{margin:4px 12px 12px;border:1px solid #e6e6e6;border-radius:6px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;color:#999}
  .send{width:24px;height:24px;border-radius:50%;background:#0d99ff;display:flex;align-items:center;justify-content:center}
  .tip{position:absolute;left:-6px;top:22px;width:12px;height:12px;background:#fff;transform:rotate(45deg)}
</style>
</head>
<body>
  <div class="frame">
    <span class="flabel">Checkout / Review</span>
    <div style="position:absolute;left:16px;top:20px;width:80px;height:10px;background:#1e1e1e;border-radius:2px"></div>
    <div style="position:absolute;left:16px;top:48px;right:16px;height:60px;border:1px solid #e6e6e6;border-radius:8px;padding:10px"><div style="width:60px;height:6px;background:#1e1e1e;border-radius:2px"></div><div style="width:110px;height:5px;background:#ccc;border-radius:2px;margin-top:8px"></div><div style="width:90px;height:5px;background:#ccc;border-radius:2px;margin-top:5px"></div></div>
    <div style="position:absolute;left:16px;top:120px;right:16px;height:60px;border:1px solid #e6e6e6;border-radius:8px;padding:10px"><div style="width:70px;height:6px;background:#1e1e1e;border-radius:2px"></div><div style="width:100px;height:5px;background:#ccc;border-radius:2px;margin-top:8px"></div><div style="width:120px;height:5px;background:#ccc;border-radius:2px;margin-top:5px"></div></div>
    <div style="position:absolute;left:16px;top:200px;right:16px;display:flex;justify-content:space-between"><div style="width:40px;height:6px;background:#999;border-radius:2px"></div><div style="width:36px;height:6px;background:#1e1e1e;border-radius:2px"></div></div>
    <div style="position:absolute;left:16px;top:216px;right:16px;display:flex;justify-content:space-between"><div style="width:52px;height:6px;background:#999;border-radius:2px"></div><div style="width:28px;height:6px;background:#1e1e1e;border-radius:2px"></div></div>
    <div style="position:absolute;left:16px;top:236px;right:16px;height:1px;background:#e6e6e6"></div>
    <div style="position:absolute;left:16px;top:248px;right:16px;display:flex;justify-content:space-between"><div style="width:30px;height:8px;background:#1e1e1e;border-radius:2px"></div><div style="width:44px;height:8px;background:#1e1e1e;border-radius:2px"></div></div>
    <div style="position:absolute;left:16px;top:300px;right:16px;height:36px;background:#1e1e1e;border-radius:18px"></div>
    <div class="pin" style="left:150px;top:128px"><span class="av" style="background:#ff7262">A</span></div>
    <div class="pin active" style="left:120px;top:292px"><span class="av" style="background:#8638e5">N</span></div>
  </div>

  <div class="thread" style="top:260px">
    <span class="tip"></span>
    <div class="th"><span>#14</span><span class="r">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#999" stroke-width="1.3"><circle cx="7" cy="7" r="5.5"/><path d="M4.5 7l2 2 3-4"/></svg>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="#999"><circle cx="3" cy="7" r="1.3"/><circle cx="7" cy="7" r="1.3"/><circle cx="11" cy="7" r="1.3"/></svg>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#999" stroke-width="1.3"><path d="M3 3l8 8M11 3l-8 8"/></svg></span></div>
    <div class="msg"><span class="av" style="background:#8638e5">N</span><div><b>Noor Haddad</b><span class="t">2h</span><p>Should the pay button say the amount? "Pay $48.20" tested better in the last round. <span class="m">@Theo</span></p><span class="react">👍 2</span></div></div>
    <div class="msg"><span class="av" style="background:#1bc47d">T</span><div><b>Theo Lind</b><span class="t">48m</span><p>Yes, and let’s lock the total so it doesn’t jump on coupon apply.</p></div></div>
    <div class="reply"><span>Reply</span><span class="send"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.6"><path d="M6 10V2M2.5 5.5L6 2l3.5 3.5"/></svg></span></div>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mindful home</title>
<meta name="tastemaker-font-intent" content="Figtree">
<style>
  html,body{margin:0;height:100%}
  body{width:390px;height:844px;overflow:hidden;background:#f6efe6;font-family:"Figtree","Plus Jakarta Sans",system-ui,sans-serif;color:#2d2b27;position:relative}
  *{box-sizing:border-box}
  .hero{height:276px;background:#f47d31;position:relative;overflow:hidden;border-radius:0 0 36px 36px}
  .hero .sun{position:absolute;width:420px;height:420px;border-radius:50%;background:#ffb169;left:-30px;top:-230px}
  .hero .hill1{position:absolute;width:520px;height:260px;border-radius:50%;background:#e5651f;left:-120px;top:180px}
  .hero .hill2{position:absolute;width:420px;height:260px;border-radius:50%;background:#c4531a;left:120px;top:210px}
  .status{position:relative;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:700;font-size:15px;color:#fff}
  .greet{position:relative;padding:12px 24px 0;color:#fff}
  .greet small{font-size:14px;font-weight:600;opacity:.85}
  .greet h1{margin:4px 0 0;font-size:30px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
  .blob{position:absolute;right:26px;top:104px}
  .content{padding:0 20px}
  .section{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
  .section h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.2px}
  .section a{font-size:14px;font-weight:700;color:#f47d31}
  .card{background:#fff;border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(45,43,39,.04)}
  .thumb{width:68px;height:68px;border-radius:16px;flex-shrink:0;position:relative;overflow:hidden}
  .thumb svg{width:68px;height:68px}
  .card b{display:block;font-size:15px;font-weight:700}
  .card span{display:block;font-size:13px;color:#7a746b;margin-top:4px;font-weight:500}
  .play{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#2d2b27;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .pills{display:flex;gap:8px;overflow:hidden;margin-top:12px}
  .pill{border-radius:999px;padding:9px 16px;background:#fff;font-size:14px;font-weight:700;white-space:nowrap;color:#2d2b27}
  .pill.on{background:#2d2b27;color:#fff}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:#fff;border-radius:28px 28px 0 0;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;box-shadow:0 -6px 24px rgba(45,43,39,.06)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#9a9388}
  .tab.on{color:#2d2b27}
  .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#2d2b27}
</style>
</head>
<body>
  <div class="hero">
    <div class="sun"></div><div class="hill1"></div><div class="hill2"></div>
    <div class="status"><span>9:41</span><span style="display:flex;gap:6px">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#fff"/><rect x="2" y="2" width="19" height="8" rx="2" fill="#fff"/><rect x="24" y="4" width="2" height="4" rx="1" fill="#fff"/></svg></span></div>
    <div class="greet"><small>Friday morning</small><h1>Good morning,<br>Amara</h1></div>
    <!-- blob character -->
    <div class="blob">
      <svg width="140" height="150" viewBox="0 0 140 150">
        <path d="M70 10c38 0 62 30 62 70 0 36-22 60-56 60-40 0-70-22-70-62C6 38 34 10 70 10z" fill="#ffd166"/>
        <path d="M70 26c28 0 46 24 46 54 0 26-16 44-42 44-30 0-52-16-52-46 0-30 20-52 48-52z" fill="#ffdc85" opacity=".6"/>
        <circle cx="54" cy="74" r="4" fill="#2d2b27"/><circle cx="90" cy="74" r="4" fill="#2d2b27"/>
        <path d="M60 92c6 6 18 6 24 0" fill="none" stroke="#2d2b27" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="44" cy="88" r="6" fill="#f47d31" opacity=".5"/><circle cx="100" cy="88" r="6" fill="#f47d31" opacity=".5"/>
      </svg>
    </div>
  </div>

  <div class="content">
    <div class="pills"><span class="pill on">For you</span><span class="pill">Sleep</span><span class="pill">Focus</span><span class="pill">Move</span><span class="pill">Stress</span></div>

    <div class="section"><h2>Today</h2><a>See all</a></div>
    <div class="card">
      <div class="thumb" style="background:#5b8def">
        <svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="44" r="22" fill="#86a9f5"/><circle cx="26" cy="30" r="8" fill="#ffd166"/><path d="M0 60c20-10 36-10 76 0v16H0z" fill="#3d6bd1"/></svg>
      </div>
      <div><b>Letting go of tension</b><span>Meditation · 10 min · Day 4</span></div>
      <div class="play"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="#fff"/></svg></div>
    </div>
    <div class="card">
      <div class="thumb" style="background:#f3b8c6">
        <svg width="76" height="76" viewBox="0 0 76 76"><path d="M12 56c10-20 42-20 52 0z" fill="#e58aa2"/><circle cx="38" cy="30" r="14" fill="#fff" opacity=".8"/><circle cx="34" cy="30" r="2.5" fill="#2d2b27"/><circle cx="44" cy="30" r="2.5" fill="#2d2b27"/></svg>
      </div>
      <div><b>Morning wake-up</b><span>Breathing · 3 min</span></div>
      <div class="play"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="#fff"/></svg></div>
    </div>

    <div class="section"><h2>Wind down tonight</h2><a>See all</a></div>
    <div class="card">
      <div class="thumb" style="background:#1f2a5c">
        <svg width="76" height="76" viewBox="0 0 76 76"><circle cx="48" cy="26" r="14" fill="#ffd166"/><circle cx="54" cy="22" r="12" fill="#1f2a5c"/><circle cx="18" cy="18" r="2" fill="#fff"/><circle cx="30" cy="40" r="1.5" fill="#fff"/><circle cx="62" cy="48" r="1.5" fill="#fff"/><path d="M0 58c24-12 50-12 76 0v18H0z" fill="#2f3f7f"/></svg>
      </div>
      <div><b>Rain on a tin roof</b><span>Sleepcast · 45 min · Dev</span></div>
      <div class="play"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="#fff"/></svg></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab on"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H5a1 1 0 0 1-1-1z"/></svg>Today</div>
    <div class="tab"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="9"/><path d="M13 8v5l3 2"/></svg>Explore</div>
    <div class="tab"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 4a9 9 0 1 0 4 10 7 7 0 0 1-4-10z"/></svg>Sleep</div>
    <div class="tab"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="9" r="4"/><path d="M5 22a8 8 0 0 1 16 0"/></svg>Profile</div>
  </div>
  <div class="homebar"></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick Entry</title>
<meta name="tastemaker-font-intent" content="Inter">
<style>
html,body{margin:0;height:100%}
body{width:600px;height:480px;overflow:hidden;background:linear-gradient(135deg,#d7dce6 0%,#c9d3e3 50%,#bcc9dd 100%);font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;color:#1d1d1f;-webkit-font-smoothing:antialiased;position:relative;font-size:13px}
.bgwin{position:absolute;left:40px;top:28px;right:40px;bottom:0;background:#fff;border-radius:10px 10px 0 0;opacity:.55;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.bgwin .l{height:8px;border-radius:4px;background:#e5e5ea;margin:0 0 14px}
.bgwin .in{padding:40px 60px}
.card{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:420px;background:#fff;border-radius:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 18px 50px rgba(20,30,60,.3),0 2px 6px rgba(0,0,0,.08);padding:14px 16px 12px;box-sizing:border-box}
.row{display:flex;align-items:flex-start;gap:10px}
.box{width:16px;height:16px;border-radius:4px;border:1.3px solid #c4c4c9;box-sizing:border-box;flex:none;margin-top:3px}
.title{font-size:15px;font-weight:500;letter-spacing:-.1px;flex:1;line-height:22px}
.title .tok{background:#dbe9ff;border-radius:4px;padding:1px 4px;color:#1d4ea8;font-weight:500}
.caret{display:inline-block;width:1.5px;height:17px;background:#2f7cf6;vertical-align:-3px;margin-left:1px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.notes{margin:4px 0 0 26px;color:#aeaeb2;font-size:13px;line-height:19px}
.foot{display:flex;align-items:center;gap:8px;margin-top:26px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 8px;font-size:12px;color:#1d1d1f;background:#f0f0f3;font-weight:500}
.pill.today{background:#fff5c2;color:#8a6d00}
.pill.ghost{color:#8e8e93;background:transparent;border:1px dashed #d1d1d6}
.save{margin-left:auto;display:flex;gap:8px}
.btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;background:#f0f0f3;color:#1d1d1f}
.btn.pri{background:linear-gradient(180deg,#4b94ff,#2f7cf6);color:#fff;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.auto{position:absolute;left:268px;top:140px;width:230px;background:#fff;border-radius:10px;box-shadow:0 0 0 .5px rgba(0,0,0,.15),0 10px 30px rgba(20,30,60,.25);padding:6px;box-sizing:border-box}
.ai{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;font-size:13px}
.ai.sel{background:#2f7cf6;color:#fff}
.ai .sub{margin-left:auto;font-size:11px;opacity:.6}
.ai .pie{color:#2f7cf6}
.ai .pie{width:13px;height:13px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box;background:conic-gradient(currentColor 0 var(--p),transparent var(--p) 100%)}
.hint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:11px;color:rgba(20,30,60,.55)}
.hint b{font-weight:600;background:rgba(255,255,255,.6);border-radius:4px;padding:1px 5px;color:#1d1d1f}
</style>
</head>
<body>
<div class="bgwin"><div class="in"><div class="l" style="width:160px;height:14px;margin-bottom:22px"></div><div class="l" style="width:90%"></div><div class="l" style="width:70%"></div><div class="l" style="width:84%"></div><div class="l" style="width:40%"></div><div class="l" style="width:76%"></div><div class="l" style="width:64%"></div><div class="l" style="width:120px;height:12px;margin-top:30px"></div><div class="l" style="width:80%"></div><div class="l" style="width:58%"></div><div class="l" style="width:72%"></div></div></div>

<div class="card">
  <div class="row"><span class="box"></span><div class="title">Send invoice to Halden Studio <span class="tok">@Fri</span> #Adm<span class="caret"></span></div></div>
  <div class="notes">Notes</div>
  <div class="foot">
    <span class="pill today"><svg width="11" height="11" viewBox="0 0 11 11"><path d="M5.5 .8l1.4 2.9 3.2.5-2.3 2.2.5 3.2-2.8-1.5-2.8 1.5.5-3.2L.9 4.2l3.2-.5z" fill="#f0b400"/></svg>Today</span>
    <span class="pill ghost">Tags</span>
    <span class="pill ghost">Checklist</span>
    <span class="pill ghost"><svg width="10" height="11" viewBox="0 0 10 11"><path d="M1 1h8l-2 3 2 3H1z" fill="none" stroke="#8e8e93" stroke-width="1.2"/><rect x="1" y="1" width="1.2" height="10" fill="#8e8e93"/></svg>Deadline</span>
  </div>
  <div class="foot" style="margin-top:12px"><span style="font-size:12px;color:#8e8e93;display:inline-flex;align-items:center;gap:6px"><svg width="13" height="13" viewBox="0 0 13 13"><path d="M1.5 3h10v7a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1z" fill="#3b82f6"/></svg>Inbox</span><span class="save"><span class="btn">Cancel</span><span class="btn pri">Save</span></span></div>
</div>

<div class="auto">
  <div class="ai sel"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 1.5h6l3 3v6h-9z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>Admin<span class="sub">Tag</span></div>
  <div class="ai"><span class="pie" style="--p:45%;color:#2f7cf6"></span>Freelance admin<span class="sub">Work</span></div>
  <div class="ai"><span class="pie" style="--p:70%;color:#2f7cf6"></span>Admin backlog<span class="sub">Work</span></div>
</div>

<div class="hint"><b>⌃ Space</b> Quick Entry with Autofill &nbsp;·&nbsp; type <b>@</b> for when, <b>#</b> for tags and lists</div>
</body>
</html>

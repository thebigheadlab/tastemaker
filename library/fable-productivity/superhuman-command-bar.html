<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command bar</title>
<meta name="tastemaker-font-intent" content="Inter">
<style>
html,body{margin:0;height:100%}
body{width:600px;height:480px;overflow:hidden;background:#111322;font-family:Inter,-apple-system,system-ui,sans-serif;color:#e7e8ef;-webkit-font-smoothing:antialiased;font-size:13px;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(700px 400px at 90% -10%,rgba(93,78,190,.35),transparent 60%),radial-gradient(600px 400px at -10% 110%,rgba(32,120,170,.25),transparent 60%),linear-gradient(160deg,#171a2d 0%,#11131f 60%,#0e1019 100%)}
.ghost{position:absolute;inset:0;padding:22px 26px;opacity:.35}
.ghost .r{display:flex;gap:12px;align-items:center;height:44px;border-bottom:1px solid rgba(255,255,255,.06)}
.ghost .r i{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);flex:none}
.ghost .r b{height:8px;border-radius:4px;background:rgba(255,255,255,.14);display:block}
.scrim{position:absolute;inset:0;background:rgba(8,9,18,.55)}
.bar{position:absolute;left:50%;top:48px;transform:translateX(-50%);width:500px;background:#1b1e30;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 70px rgba(0,0,0,.6);overflow:hidden}
.in{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}
.in .q{color:#fff}
.in .ph{color:#5e6178}
.caret{display:inline-block;width:1.5px;height:17px;background:#aab4ff;vertical-align:-3px;animation:b 1s step-end infinite}
@keyframes b{50%{opacity:0}}
.sec{padding:10px 18px 4px;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:#5e6178;font-weight:600}
.it{display:flex;align-items:center;gap:12px;padding:8px 18px;color:#c9cbd8;font-size:13.5px}
.it svg{flex:none}
.it.sel{background:rgba(124,140,255,.16);color:#fff}
.it .k{margin-left:auto;display:flex;gap:4px}
.it .k span{border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:0 5px;font-size:11px;color:#9a9db3;min-width:12px;text-align:center;line-height:17px;background:rgba(255,255,255,.03)}
.it.sel .k span{color:#dfe2ff;border-color:rgba(255,255,255,.25)}
.it em{font-style:normal;color:#fff;font-weight:500}
.it .sub{color:#6c6f86;font-size:12px;margin-left:4px}
.foot{display:flex;align-items:center;gap:16px;padding:9px 18px;font-size:11px;color:#5e6178;border-top:1px solid rgba(255,255,255,.07)}
.foot span b{font-weight:500;color:#9a9db3;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:0 4px;margin-right:5px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="ghost">
  <div class="r"><i></i><b style="width:120px"></b><b style="width:260px"></b></div>
  <div class="r"><i></i><b style="width:90px"></b><b style="width:300px"></b></div>
  <div class="r"><i></i><b style="width:140px"></b><b style="width:220px"></b></div>
  <div class="r"><i></i><b style="width:110px"></b><b style="width:280px"></b></div>
  <div class="r"><i></i><b style="width:130px"></b><b style="width:240px"></b></div>
  <div class="r"><i></i><b style="width:100px"></b><b style="width:290px"></b></div>
  <div class="r"><i></i><b style="width:150px"></b><b style="width:200px"></b></div>
  <div class="r"><i></i><b style="width:120px"></b><b style="width:260px"></b></div>
  <div class="r"><i></i><b style="width:90px"></b><b style="width:300px"></b></div>
</div>
<div class="scrim"></div>
<div class="bar">
  <div class="in"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="#8b8ea3" stroke-width="1.5"/><path d="m10.8 10.8 3.4 3.4" stroke="#8b8ea3" stroke-width="1.5" stroke-linecap="round"/></svg><span class="q">rem<span class="caret"></span><span class="ph">ind me…</span></span></div>
  <div class="sec">Commands</div>
  <div class="it sel"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="5.8" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 4.3v3.4l2.2 1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span><em>Rem</em>ind me</span><span class="sub">Bring this back later</span><span class="k"><span>H</span></span></div>
  <div class="it"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 4.5h11M2 7.5h11M2 10.5h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span><em>Rem</em>ove label</span><span class="k"><span>⇧</span><span>L</span></span></div>
  <div class="it"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M3 3h9v9H3z" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7.5l1.5 1.5 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Mark <em>rem</em>aining as done</span><span class="k"><span>⇧</span><span>E</span></span></div>
  <div class="sec">Go to</div>
  <div class="it"><svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="5.8" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 4.3v3.4l2.2 1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span><em>Rem</em>inders</span><span class="sub">4 scheduled</span><span class="k"><span>G</span><span>H</span></span></div>
  <div class="sec">Contacts</div>
  <div class="it"><span style="width:18px;height:18px;border-radius:50%;background:#c0607f;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#fff">RE</span><span><em>Rem</em>i Laurent</span><span class="sub">remi@example.com</span></div>
  <div class="foot"><span><b>↑↓</b>Navigate</span><span><b>↵</b>Select</span><span><b>esc</b>Close</span><span style="margin-left:auto">Tip: type <b style="margin:0 2px">?</b> for all shortcuts</span></div>
</div>
</body>
</html>

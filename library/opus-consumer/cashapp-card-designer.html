<!doctype html>
<html><head><meta charset="utf-8"><title>Card designer</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#f2f2f2;font-family:Manrope,"Cash Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#000;overflow:hidden;-webkit-font-smoothing:antialiased;width:480px;height:600px;padding:22px 24px 0}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:800}
.hd span{font-size:15px;color:#00b843}
.card{margin:22px auto 0;width:236px;height:374px;border-radius:18px;background:#111;position:relative;overflow:hidden;box-shadow:0 24px 40px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.08)}
.card .tag{position:absolute;left:20px;top:22px;color:#fff;font-size:15px;font-weight:800}
.card .chip{position:absolute;right:22px;top:20px;width:30px;height:40px;border-radius:5px;background:linear-gradient(160deg,#f2f2f2,#9c9c9c)}
.card .vs{position:absolute;right:20px;bottom:20px;color:#fff;font-style:italic;font-weight:800;font-size:20px;letter-spacing:-.03em}
.card .sig{position:absolute;left:12px;right:12px;top:110px}
.card .nfc{position:absolute;left:20px;bottom:22px}
.tools{display:flex;justify-content:center;gap:10px;margin-top:22px}
.tools span{height:40px;border-radius:20px;background:#fff;padding:0 16px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tools span.on{background:#000;color:#fff}
.sw{display:flex;justify-content:center;gap:12px;margin-top:16px}
.sw i{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.sw i.on{box-shadow:0 0 0 2px #f2f2f2,0 0 0 4px #00d64f}
</style></head><body>
<div class="hd"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>Design your card<span>Done</span></div>
<div class="card">
  <span class="tag">$dmorales</span><span class="chip"></span>
  <svg class="sig" width="212" height="150" viewBox="0 0 212 150"><path d="M20 96c10-30 26-60 34-58s-8 50-2 54 22-40 32-40-6 34 2 36 18-26 26-24 2 22 10 22 20-30 30-28c8 2-4 26 4 26s18-12 28-18" fill="none" stroke="#00d64f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 118c40-6 90-8 140-4" fill="none" stroke="#00d64f" stroke-width="3" stroke-linecap="round" opacity=".6"/><g transform="translate(150 20)" fill="#ff5ca8"><path d="M14 0l4 10 10 1-8 7 3 10-9-6-9 6 3-10-8-7 10-1z"/></g></svg>
  <svg class="nfc" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M8 7a7 7 0 0 1 0 10M12 5a10 10 0 0 1 0 14M4 10a3 3 0 0 1 0 4"/></svg>
  <span class="vs">VISA</span>
</div>
<div class="tools"><span class="on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M4 20l4-1 11-11-3-3L5 16zM14 6l3 3"/></svg>Draw</span><span><svg width="16" height="16" viewBox="0 0 24 24" fill="#000"><path d="M12 2l2.9 6.9L22 9.3l-5.5 4.7 1.7 7.3L12 17.5 5.8 21.3l1.7-7.3L2 9.3l7.1-.4z"/></svg>Stamps</span><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>Text</span><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Undo</span></div>
<div class="sw"><i class="on" style="background:#00d64f"></i><i style="background:#fff"></i><i style="background:#ff5ca8"></i><i style="background:#ffd23f"></i><i style="background:#4aa8ff"></i><i style="background:#9b6bff"></i></div>
</body></html>

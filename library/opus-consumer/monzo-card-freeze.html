<!doctype html>
<html><head><meta charset="utf-8"><title>Card freeze</title>
<meta name="tastemaker-font-intent" content="DM Sans">
<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#0b1a2c;font-family:"DM Sans","Oldschool Grotesk",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;width:480px;height:600px;padding:28px 24px 0}
.row{display:flex;gap:16px;justify-content:center}
.card{width:200px;height:126px;border-radius:12px;background:#ff4f40;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(255,79,64,.3)}
.card .chip{position:absolute;left:18px;top:44px;width:30px;height:22px;border-radius:4px;background:linear-gradient(135deg,#ffe0c8,#e8b08a)}
.card .nm{position:absolute;left:18px;bottom:14px;font-size:11px;font-weight:600;letter-spacing:.06em;opacity:.9}
.card .br{position:absolute;right:16px;top:14px;font-size:15px;font-weight:800;letter-spacing:-.02em}
.card .mc{position:absolute;right:14px;bottom:12px;display:flex}
.card .mc i{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.9)}
.card .mc i+i{margin-left:-8px;background:rgba(255,220,210,.75)}
.card.frozen{background:linear-gradient(135deg,#bfe3ff,#8cc4f0);box-shadow:0 14px 30px rgba(140,196,240,.25)}
.card.frozen:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.25) 0 2px,transparent 2px 12px)}
.ice{position:absolute;left:50%;top:50%;margin:-22px 0 0 -22px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center}
.cap{text-align:center;font-size:13px;color:#9fb0c3;margin-top:10px;font-weight:600}
.panel{margin-top:22px;background:#13253a;border-radius:20px;padding:4px 16px}
.r{display:flex;align-items:center;gap:14px;height:62px}
.r+.r{border-top:1px solid #1d3049}
.r .ic{width:36px;height:36px;border-radius:50%;background:#1e3550;display:grid;place-items:center;flex:none}
.r .m{flex:1}
.r b{display:block;font-size:15px;font-weight:600}
.r small{font-size:13px;color:#9fb0c3}
.tg{width:50px;height:30px;border-radius:15px;background:#6db3ff;position:relative;flex:none}
.tg:after{content:"";position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff}
.tg.off{background:#2a4260}.tg.off:after{right:auto;left:3px}
.chev{flex:none}
</style></head><body>
<div class="row">
  <div><div class="card"><span class="br">mintra</span><span class="chip"></span><span class="nm">T OKAFOR</span><span class="mc"><i></i><i></i></span></div><div class="cap">Active</div></div>
  <div><div class="card frozen"><span class="br" style="color:#1d4f7a">mintra</span><span class="chip" style="opacity:.6"></span><span class="nm" style="color:#1d4f7a">T OKAFOR</span><div class="ice"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2a74b5" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg></div></div><div class="cap" style="color:#8cc4f0">Frozen</div></div>
</div>
<div class="panel">
  <div class="r"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8cc4f0" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg></div><div class="m"><b>Freeze card</b><small>Block all payments instantly</small></div><span class="tg"></span></div>
  <div class="r"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></div><div class="m"><b>Online payments</b><small>Allowed</small></div><span class="tg off"></span></div>
  <div class="r"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z"/></svg></div><div class="m"><b>View PIN</b><small>Use Face ID to reveal</small></div><svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#5c7089" stroke-width="2"><path d="m1 1 6 6-6 6"/></svg></div>
  <div class="r"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 3 3 7v5c0 5 4 8 9 9 5-1 9-4 9-9V7z"/><path d="M9 12l2 2 4-4"/></svg></div><div class="m"><b>Gambling block</b><small>On · takes 48 hours to turn off</small></div><svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#5c7089" stroke-width="2"><path d="m1 1 6 6-6 6"/></svg></div>
  <div class="r"><div class="ic" style="background:#3a1d26"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff7a6e" stroke-width="2"><path d="M12 8v5M12 16.5h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div><div class="m"><b style="color:#ff7a6e">Report lost or stolen</b></div><svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="#5c7089" stroke-width="2"><path d="m1 1 6 6-6 6"/></svg></div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Transaction + split</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#f4f1ec;font-family:"DM Sans","Oldschool Grotesk",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#0b1a2c;overflow:hidden;-webkit-font-smoothing:antialiased;width:480px;height:600px;position:relative}
.map{height:130px;position:relative;overflow:hidden;background:#e6efe6}
.lg{position:absolute;left:24px;top:96px;width:64px;height:64px;border-radius:50%;background:#1a1a1a;border:4px solid #f4f1ec;display:grid;place-items:center;z-index:2}
.body{padding:40px 24px 0}
.amt{font-size:40px;font-weight:800;letter-spacing:-.03em}
.amt span{font-size:24px}
.mer{font-size:18px;font-weight:700;margin-top:2px}
.meta{font-size:14px;color:#5b6876;margin-top:2px}
.chips{display:flex;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:7px 12px;font-size:13px;font-weight:600}
.chip i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
.split{margin-top:18px;background:#fff;border-radius:18px;padding:14px 16px}
.split .h{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700}
.split .h span{font-size:13px;color:#ff4f40;font-weight:700}
.p{display:flex;align-items:center;gap:12px;margin-top:12px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.p b{flex:1;font-size:15px;font-weight:600}
.p small{font-size:12px;font-weight:700;border-radius:10px;padding:3px 8px}
.p .v{font-size:15px;font-weight:700;width:58px;text-align:right}
.btn{position:absolute;left:24px;right:24px;bottom:22px;height:50px;border-radius:25px;background:#ff4f40;color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
</style></head><body>
<div class="map"><svg width="480" height="130" viewBox="0 0 480 130">
  <rect width="480" height="130" fill="#e7eee4"/>
  <path d="M300 0c20 40 0 80 40 130h140V0z" fill="#cfe4c6"/>
  <g stroke="#fff" stroke-width="10" fill="none"><path d="M0 70h480M180 0v130"/></g>
  <g stroke="#fff" stroke-width="4" fill="none"><path d="M0 30h480M0 110h480M80 0v130M300 0l-40 130M400 0v130"/></g>
  <path d="M0 70h480" stroke="#ffd36b" stroke-width="4"/>
  <circle cx="240" cy="62" r="12" fill="#ff4f40" stroke="#fff" stroke-width="3"/>
  <text x="258" y="50" font-family="DM Sans" font-size="11" font-weight="700" fill="#5b6876">Upper St</text>
</svg></div>
<div class="lg"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="10" fill="none" stroke="#ffb347" stroke-width="3"/><path d="M15 5v20M5 15h20" stroke="#ffb347" stroke-width="2"/></svg></div>
<div class="body">
  <div class="amt">£86<span>.40</span></div>
  <div class="mer">Forno Pizzeria</div>
  <div class="meta">Friday 23 Oct, 21:14 · Islington, London</div>
  <div class="chips"><span class="chip"><i style="background:#ff8a3d"><svg width="10" height="10" viewBox="0 0 24 24" fill="#fff"><path d="M4 3h2v8a2 2 0 0 0 4 0V3h2v8a4 4 0 0 1-3 3.9V21H7v-6.1A4 4 0 0 1 4 11zM16 3c3 0 4 4 4 8h-2v10h-2z"/></svg></i>Eating out</span><span class="chip">#fridaydinner</span><span class="chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0b1a2c" stroke-width="2.2"><path d="M4 7h16v12H4zM9 7V5h6v2"/></svg>Receipt</span></div>
  <div class="split">
    <div class="h">Split 3 ways<span>£28.80 still owed</span></div>
    <div class="p"><div class="av" style="background:#ff4f40">TO</div><b>You</b><div class="v">£28.80</div></div>
    <div class="p"><div class="av" style="background:#2c8f8a">SO</div><b>Sam Okafor</b><small style="background:#e4f6ec;color:#16884e">Paid</small><div class="v">£28.80</div></div>
    <div class="p"><div class="av" style="background:#6c4ad9">PR</div><b>Priya Rao</b><small style="background:#fff1d6;color:#a46b00">Pending</small><div class="v">£28.80</div></div>
  </div>
</div>
<div class="btn">Nudge Priya</div>
</body></html>

<!doctype html>

<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#f4f1ec;font-family:"DM Sans","Oldschool Grotesk",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#0b1a2c;overflow:hidden;-webkit-font-smoothing:antialiased;width:390px;height:844px;position:relative}
.status{height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 40px;font-weight:600;font-size:16px}
.sicons{display:flex;gap:6px;align-items:center}
.hd{padding:8px 16px 0;display:flex;justify-content:space-between;align-items:center}
.hd h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em}
.add{height:36px;border-radius:18px;background:#0b1a2c;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;padding:0 14px}
.tot{margin:14px 16px 0;font-size:15px;color:#5b6876}
.tot b{color:#0b1a2c;font-size:15px}
.int{margin:14px 16px 0;background:#ffe9e5;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.int .ic{width:38px;height:38px;border-radius:50%;background:#ff4f40;display:grid;place-items:center;flex:none}
.int b{display:block;font-size:15px;font-weight:700}
.int small{font-size:13px;color:#5b6876}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px 0}
.p{background:#fff;border-radius:18px;overflow:hidden}
.p .im{height:104px;position:relative;overflow:hidden}
.p .bd{padding:10px 12px 12px}
.p b{display:block;font-size:15px;font-weight:700}
.p .v{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.p .bar{height:6px;border-radius:3px;background:#ece8e1;margin-top:8px;overflow:hidden}
.p .bar i{display:block;height:100%;border-radius:3px}
.p small{display:block;font-size:12px;color:#5b6876;margin-top:5px}
.lock{position:absolute;right:10px;top:10px;background:rgba(11,26,44,.7);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:3px 8px;display:flex;align-items:center;gap:4px}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid #e6e1d8;display:flex;justify-content:space-around;padding-top:9px}
.tab div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:600;color:#8a96a3}
.tab .on{color:#0b1a2c}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;background:#0b1a2c;border-radius:3px}
</style></head><body>

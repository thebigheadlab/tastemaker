<!doctype html>
<html><head><meta charset="utf-8"><title>Rate your trip</title>
<meta name="tastemaker-font-intent" content="Inter Tight">
<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#000;font-family:"Inter Tight","Uber Move",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;width:480px;height:600px;padding:26px 24px 0;position:relative}
.top{display:flex;justify-content:space-between;align-items:center}
.top span{font-size:14px;color:#a6a6a6;font-weight:500}
.av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#6b4a3a,#b07a5a);margin:18px auto 0;display:grid;place-items:center;font-weight:700;font-size:22px;position:relative}
h2{text-align:center;font-size:24px;font-weight:700;letter-spacing:-.01em;margin:14px 0 0;line-height:29px}
.sub{text-align:center;font-size:14px;color:#a6a6a6;margin-top:4px}
.stars{display:flex;justify-content:center;gap:10px;margin-top:18px}
.q{font-size:16px;font-weight:600;margin-top:22px}
.chips{display:flex;gap:10px;margin-top:12px}
.chip{flex:1;background:#1f1f1f;border-radius:12px;padding:12px 6px 10px;text-align:center;font-size:12px;font-weight:600;color:#d9d9d9;border:2px solid transparent}
.chip.on{border-color:#fff;color:#fff}
.chip svg{display:block;margin:0 auto 6px}
.tips{display:flex;gap:8px;margin-top:12px}
.tips span{flex:1;height:44px;border-radius:22px;background:#1f1f1f;display:grid;place-items:center;font-size:15px;font-weight:600}
.tips span.on{background:#fff;color:#000}
.btn{position:absolute;left:24px;right:24px;bottom:22px;height:52px;border-radius:10px;background:#fff;color:#000;display:grid;place-items:center;font-size:17px;font-weight:600}
</style></head><body>
<div class="top"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg><span>Trip · Oct 24, 10:16 PM · $18.42</span></div>
<div class="av">MR</div>
<h2>How was your ride with Marcus?</h2>
<div class="sub">Ferry Building → Mission Dolores Park</div>
<div class="stars">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9L22 9.3l-5.5 4.7 1.7 7.3L12 17.5 5.8 21.3l1.7-7.3L2 9.3l7.1-.4z"/></svg>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9L22 9.3l-5.5 4.7 1.7 7.3L12 17.5 5.8 21.3l1.7-7.3L2 9.3l7.1-.4z"/></svg>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9L22 9.3l-5.5 4.7 1.7 7.3L12 17.5 5.8 21.3l1.7-7.3L2 9.3l7.1-.4z"/></svg>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9L22 9.3l-5.5 4.7 1.7 7.3L12 17.5 5.8 21.3l1.7-7.3L2 9.3l7.1-.4z"/></svg>
  <svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.9L22 9.3l-5.5 4.7 1.7 7.3L12 17.5 5.8 21.3l1.7-7.3L2 9.3l7.1-.4z"/></svg>
</div>
<div class="q">Give a compliment</div>
<div class="chips">
  <div class="chip on"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#276ef1"/><path d="M9 16c1.5 3 3.5 4 6 4s4.5-1 6-4M10 11h.01M20 11h.01" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>Great chat</div>
  <div class="chip on"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#05a357"/><path d="M7 18h16l-2-5H9zM10 21h.01M20 21h.01" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>Smooth driving</div>
  <div class="chip"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#ffc043"/><path d="M15 7l2 5h5l-4 3 1.5 5L15 17l-4.5 3 1.5-5-4-3h5z" fill="#fff"/></svg>Clean car</div>
  <div class="chip"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#7356bf"/><path d="M11 20V10l10-2v10M11 20a2 2 0 1 1-2-2 2 2 0 0 1 2 2zM21 18a2 2 0 1 1-2-2 2 2 0 0 1 2 2z" stroke="#fff" stroke-width="1.8" fill="none"/></svg>Good music</div>
</div>
<div class="q">Add a tip</div>
<div class="tips"><span>$2</span><span class="on">$4</span><span>$6</span><span>Custom</span></div>
<div class="btn">Done</div>
</body></html>

.pr{margin-top:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);position:relative}
.pr i{position:absolute;left:0;top:0;bottom:0;width:38%;background:#fff;border-radius:2px}
.pr u{position:absolute;left:38%;top:-4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff}
.tm{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.7);margin-top:8px;font-weight:500}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.play{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center}
.dot{position:relative}
.dot:after{content:"";position:absolute;left:50%;bottom:-8px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#1ed760}
.bot{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.dev{display:flex;align-items:center;gap:8px;color:#1ed760;font-size:12px;font-weight:700;letter-spacing:.01em}
.ly{position:absolute;left:12px;right:12px;bottom:0;height:56px;border-radius:12px 12px 0 0;background:#c2452c;padding:16px 16px 0;display:flex;justify-content:space-between;font-weight:700;font-size:16px}

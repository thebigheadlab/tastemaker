html,body{margin:0;height:100%}

body{background:#000;font-family:Manrope,"Cash Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;width:390px;height:844px;position:relative}

.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 0}
.bar h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.av{width:36px;height:36px;border-radius:50%;background:#00d64f;color:#000;display:grid;place-items:center;font-weight:800;font-size:14px}
.bal{margin:18px 16px 0;background:#141414;border-radius:24px;padding:20px}
.bal small{font-size:14px;color:#9a9a9a;font-weight:600;display:flex;justify-content:space-between}
.bal small u{color:#9a9a9a;text-decoration:none;display:flex;align-items:center;gap:4px}
.bal .n{font-size:48px;font-weight:800;letter-spacing:-.035em;margin-top:6px}
.bal .acct{font-size:13px;color:#9a9a9a;font-weight:600;margin-top:2px}
.bb{display:flex;gap:10px;margin-top:18px}
.bb div{flex:1;height:48px;border-radius:24px;background:#262626;display:grid;place-items:center;font-size:16px;font-weight:800}
.bb div.g{background:#00d64f;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 16px 0}
.tile{background:#141414;border-radius:24px;padding:16px;height:172px;position:relative;overflow:hidden}
.tile .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.tile b{display:block;font-size:15px;font-weight:700;margin-top:34px}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.tile .d{font-size:13px;font-weight:700;margin-top:2px}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;background:#000;border-top:1px solid #1d1d1d}
.tab .bal2{font-size:15px;font-weight:800;color:#fff}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;background:#fff;border-radius:3px}
</style></head><body>

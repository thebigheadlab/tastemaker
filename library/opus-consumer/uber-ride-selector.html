<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#fff;font-family:"Inter Tight","Uber Move",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#000;overflow:hidden;-webkit-font-smoothing:antialiased;width:390px;height:844px;position:relative}
.map{position:absolute;inset:0 0 auto 0;height:400px}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 40px;font-weight:600;font-size:16px;z-index:3}
.sicons{display:flex;gap:6px;align-items:center}
.back{position:absolute;left:16px;top:58px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);z-index:3}
.lbl{position:absolute;background:#000;color:#fff;font-size:13px;font-weight:600;padding:7px 10px;display:flex;align-items:center;gap:8px;z-index:2}
.lbl i{font-style:normal;background:#fff;color:#000;padding:2px 5px;font-size:11px;font-weight:700;line-height:13px;text-align:center}
.sheet{position:absolute;left:0;right:0;top:356px;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.grab{width:36px;height:4px;border-radius:2px;background:#d6d6d6;margin:8px auto 0}
.st{text-align:center;font-size:16px;font-weight:600;margin-top:12px;padding-bottom:10px;border-bottom:1px solid #eee}
.opt{display:flex;align-items:center;gap:12px;padding:8px 14px;margin:4px 10px 0;border-radius:12px;border:2px solid transparent}
.opt.on{border-color:#000}
.car{width:68px;height:44px;flex:none;display:grid;place-items:center}
.opt .m{flex:1}
.opt b{font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}
.opt b small{font-size:13px;font-weight:500;display:flex;align-items:center;gap:2px}
.opt .sub{font-size:13px;color:#5e5e5e;margin-top:1px}
.opt .pr{text-align:right;font-size:17px;font-weight:600}
.opt .pr s{display:block;font-size:13px;color:#5e5e5e;font-weight:400}
.promo{display:inline-block;background:#e9f3ff;color:#1a5fd1;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;margin-top:3px}
.foot{position:absolute;left:0;right:0;bottom:0;padding:10px 16px 30px;background:#fff;border-top:1px solid #eee}
.pay{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.pay span{display:flex;align-items:center;gap:8px}
.btn{height:54px;background:#000;color:#fff;border-radius:10px;display:grid;place-items:center;font-size:17px;font-weight:600}
</style></head><body>

html,body{margin:0;height:100%}

body{background:#00d64f;font-family:Manrope,"Cash Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;width:390px;height:844px;position:relative}
.status{height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 40px;font-weight:700;font-size:16px}

.av{width:36px;height:36px;border-radius:50%;background:#fff;color:#00a83d;display:grid;place-items:center;font-weight:800;font-size:14px}
.amt{text-align:center;margin-top:70px;font-size:112px;font-weight:800;letter-spacing:-.04em;line-height:112px}

.cur{display:flex;justify-content:center;margin-top:14px}

.keys{display:grid;grid-template-columns:repeat(3,1fr);margin:40px 28px 0;row-gap:4px}
.keys div{height:58px;display:grid;place-items:center;font-size:30px;font-weight:700}
.btns{display:flex;gap:12px;margin:22px 20px 0}
.btns div{flex:1;height:56px;border-radius:28px;background:rgba(0,0,0,.14);display:grid;place-items:center;font-size:18px;font-weight:800}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px}
.tab .bal{font-size:15px;font-weight:800;opacity:.8}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;background:#fff;border-radius:3px}

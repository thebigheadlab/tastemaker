<!doctype html>
<html><head><meta charset="utf-8"><title>Search bar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#f7f7f7;font-family:"Nunito Sans",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#222;overflow:hidden;-webkit-font-smoothing:antialiased;width:600px;height:480px;padding:28px 24px}
.tabs{display:flex;justify-content:center;gap:28px;font-size:15px;font-weight:600;color:#6a6a6a;margin-bottom:18px}
.tabs .on{color:#222;position:relative}
.tabs .on:after{content:"";position:absolute;left:30%;right:30%;bottom:-8px;height:2px;background:#222;border-radius:2px}
.bar{display:flex;align-items:center;background:#ebebeb;border:1px solid #ddd;border-radius:40px;height:66px;position:relative}
.s{flex:1;height:100%;padding:13px 0 0 26px;border-radius:40px;position:relative}
.s label{display:block;font-size:12px;font-weight:700}
.s span{font-size:14px;color:#6a6a6a;white-space:nowrap}
.s.on{background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.s.on span{color:#222;font-weight:600}
.s.w{flex:1.4}
.s+.s:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:1px;background:#ccc}
.s.on:before,.s.on+.s:before{display:none}
.go{position:absolute;right:9px;top:9px;height:48px;border-radius:24px;background:linear-gradient(90deg,#e61e4d,#d70466);color:#fff;display:flex;align-items:center;gap:8px;padding:0 18px 0 16px;font-weight:700;font-size:15px}
.drop{margin-top:12px;width:400px;background:#fff;border-radius:32px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:22px 16px 16px}
.drop h4{margin:0 0 8px 16px;font-size:12px;font-weight:700}
.r{display:flex;align-items:center;gap:16px;padding:9px 16px;border-radius:12px}
.r.hl{background:#f7f7f7}
.ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.r b{display:block;font-size:14px;font-weight:600}
.r small{font-size:13px;color:#6a6a6a}
</style></head><body>
<div class="tabs"><span class="on">Homes</span><span>Experiences</span><span>Services</span></div>
<div class="bar">
  <div class="s w on"><label>Where</label><span>Kyoto, Japan</span></div>
  <div class="s"><label>When</label><span>Any week</span></div>
  <div class="s" style="flex:1.9;padding-right:120px"><label>Who</label><span>Add guests</span></div>
  <div class="go"><svg width="14" height="14" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="4.5"><circle cx="13" cy="13" r="10"/><path d="M20.5 20.5 29 29"/></svg>Search</div>
</div>
<div class="drop">
  <h4>Suggested destinations</h4>
  <div class="r hl"><div class="ic" style="background:#e0f1ff"><svg width="24" height="24" viewBox="0 0 32 32" fill="none" stroke="#3279c9" stroke-width="2.2"><path d="M16 3c-5 0-9 4-9 9 0 7 9 17 9 17s9-10 9-17c0-5-4-9-9-9z"/><circle cx="16" cy="12" r="3.2"/></svg></div><div><b>Nearby</b><small>Find what's around you</small></div></div>
  <div class="r"><div class="ic" style="background:#fde6e4"><svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="#c4402f" stroke-width="2"><path d="M3 9h26M5 13h22M9 9v20M23 9v20M7 4c6 2 12 2 18 0"/></svg></div><div><b>Kyoto, Japan</b><small>For sights like Fushimi Inari Taisha</small></div></div>
  <div class="r"><div class="ic" style="background:#e7f4e4"><svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="#3e8a3a" stroke-width="2"><path d="M4 28 14 8l5 10 3-5 6 15z"/><circle cx="24" cy="7" r="2.5"/></svg></div><div><b>Hakone, Japan</b><small>Popular lake destination</small></div></div>
  <div class="r"><div class="ic" style="background:#f2ebfb"><svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="#7a4bc4" stroke-width="2"><path d="M6 28V12h6V6h8v6h6v16M10 16h2M10 20h2M10 24h2M20 16h2M20 20h2M20 24h2M15 10h2"/></svg></div><div><b>Osaka, Japan</b><small>Great for a weekend getaway</small></div></div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Card controls</title>
<meta name="tastemaker-font-intent" content="Inter">
<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#0b0b0f;font-family:Inter,"Aeonik Pro",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;width:480px;height:600px;padding:18px 24px 0;letter-spacing:-.01em}
.cards{position:relative;height:240px}
.cd{position:absolute;top:0;width:340px;height:214px;border-radius:18px;padding:20px 22px;overflow:hidden}
.cd.main{left:46px;background:linear-gradient(130deg,#ff8a5b 0%,#ff4f9a 45%,#7b3cff 100%);box-shadow:0 18px 40px rgba(123,60,255,.35)}
.cd.ghost{left:0;transform:scale(.88);transform-origin:left center;background:linear-gradient(130deg,#2b2f3a,#11131a);opacity:.55}
.cd.ghost2{left:150px;transform:scale(.88);transform-origin:left center;background:linear-gradient(130deg,#c9ccd3,#7d828d);opacity:.5}
.brand{font-size:20px;font-weight:800;letter-spacing:-.04em}
.cd .vt{position:absolute;right:22px;top:20px;font-size:12px;font-weight:600;background:rgba(255,255,255,.22);border-radius:10px;padding:4px 9px}
.cd .num{position:absolute;left:22px;bottom:20px;font-size:16px;font-weight:600;letter-spacing:.06em}
.cd .vs{position:absolute;right:22px;bottom:16px;font-style:italic;font-weight:800;font-size:22px;letter-spacing:-.03em}
.cd .chip{position:absolute;left:22px;top:78px;width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,#f6e2b0,#c4a25c)}
.lbl{text-align:center;margin-top:-4px}
.lbl b{font-size:17px;font-weight:600}
.lbl small{display:block;font-size:13px;color:#8d8d93;margin-top:3px}
.acts{display:flex;justify-content:center;gap:34px;margin-top:20px}
.a{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
.a span{width:52px;height:52px;border-radius:50%;background:#1f1f24;display:grid;place-items:center}
.a.on span{background:#d9ecff}
.list{margin-top:22px;background:#17171b;border-radius:20px;padding:2px 16px}
.r{display:flex;align-items:center;gap:14px;height:56px}
.r+.r{border-top:1px solid #232328}
.r .ic{width:34px;height:34px;border-radius:50%;background:#26262c;display:grid;place-items:center}
.r b{flex:1;font-size:15px;font-weight:500}
.tg{width:46px;height:28px;border-radius:14px;background:#0666eb;position:relative}
.tg:after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff}
.tg.off{background:#3a3a40}.tg.off:after{right:auto;left:3px}
</style></head><body>
<div class="cards">
  <div class="cd ghost"></div>
  <div class="cd ghost2"></div>
  <div class="cd main"><span class="brand">nuvo</span><span class="vt">Virtual</span><div class="num">•• 4821</div><div class="vs">VISA</div>
    <svg style="position:absolute;right:-40px;top:20px;opacity:.25" width="220" height="220" viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="#fff" stroke-width="2"/><circle cx="110" cy="110" r="70" fill="none" stroke="#fff" stroke-width="2"/><circle cx="110" cy="110" r="40" fill="none" stroke="#fff" stroke-width="2"/></svg></div>
</div>
<div class="lbl"><b>Online shopping</b><small>Disposable · regenerates after each payment</small></div>
<div class="acts">
  <div class="a on"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0666eb" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg></span>Freeze</div>
  <div class="a"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span>Show details</div>
  <div class="a"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>Limits</div>
</div>
<div class="list">
  <div class="r"><div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div><b>Location-based security</b><span class="tg"></span></div>
  <div class="r"><div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></div><b>Online transactions</b><span class="tg"></span></div>
  <div class="r"><div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 12a7 7 0 0 1 14 0M8 12a4 4 0 0 1 8 0M11 12a1 1 0 0 1 2 0"/></svg></div><b>Contactless payments</b><span class="tg off"></span></div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>Product hero</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#000;font-family:Inter,-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#f5f5f7;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.gn{height:44px;background:rgba(22,22,23,.8);display:flex;justify-content:center;align-items:center;gap:34px;font-size:12px;color:rgba(255,255,255,.8);font-weight:400;letter-spacing:-.01em}
.ln{height:52px;border-bottom:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc(50% - 490px))}
.ln .nm{font-size:21px;font-weight:600;letter-spacing:.011em}
.ln .lk{display:flex;align-items:center;gap:24px;font-size:12px;color:rgba(255,255,255,.8)}
.buy{background:#0071e3;color:#fff;border-radius:980px;padding:4px 11px;font-size:12px}
.hero{text-align:center;padding-top:44px;position:relative;height:704px;overflow:hidden}
.eyebrow{font-size:28px;font-weight:600;color:#f5f5f7;letter-spacing:.007em}
h1{margin:6px 0 0;font-size:80px;line-height:84px;font-weight:700;letter-spacing:-.025em;background:linear-gradient(180deg,#f3f3f3 10%,#9a9aa0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.price{margin-top:16px;font-size:19px;color:#86868b;font-weight:400;letter-spacing:.012em}
.ctas{margin-top:22px;display:flex;justify-content:center;align-items:center;gap:30px}
.ctas .b{background:#0071e3;color:#fff;border-radius:980px;padding:11px 22px;font-size:17px}
.ctas .l{color:#2997ff;font-size:17px;display:flex;align-items:center;gap:4px}
.stage{position:absolute;left:0;right:0;bottom:-120px;height:470px;display:flex;justify-content:center;align-items:flex-end;gap:0}
.glow{position:absolute;left:50%;bottom:0;width:900px;height:360px;margin-left:-450px;background:radial-gradient(ellipse at 50% 70%,rgba(214,140,80,.32),rgba(120,70,40,.12) 45%,transparent 70%)}
.ph{width:250px;height:510px;border-radius:52px;position:relative;background:linear-gradient(135deg,#e8c4a2 0%,#b98a64 30%,#8a5f40 55%,#d0a581 80%,#a87a56 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),inset 0 0 0 7px #5b3c26,0 30px 80px rgba(0,0,0,.6)}
.ph.back{transform:translateX(40px) rotate(-8deg);z-index:1}
.ph.front{transform:translateX(-40px) translateY(30px) rotate(6deg);z-index:2;background:#000;box-shadow:inset 0 0 0 3px #b98a64,inset 0 0 0 6px #6d4a30,0 30px 80px rgba(0,0,0,.7)}
.plateau{position:absolute;left:14px;top:14px;width:222px;height:150px;border-radius:38px;background:linear-gradient(140deg,#d6ae88,#9c6e4c 60%,#c49a76);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.25)}
.lens{position:absolute;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#0b0b12 0 30%,#1c2230 32% 46%,#2a2a2e 48% 60%,#7a5a40 62% 70%,#3a2a20 72%);box-shadow:0 0 0 3px #8c6446,0 3px 8px rgba(0,0,0,.4)}
.lens:after{content:"";position:absolute;left:18px;top:16px;width:9px;height:9px;border-radius:50%;background:rgba(140,170,255,.45)}
.screen{position:absolute;inset:9px;border-radius:44px;background:linear-gradient(160deg,#2a160e 0%,#7a3a18 40%,#e0874a 75%,#ffd0a0 100%);overflow:hidden}
.island{position:absolute;top:14px;left:50%;width:86px;height:26px;margin-left:-43px;background:#000;border-radius:20px}
.clock{position:absolute;top:66px;left:0;right:0;text-align:center;font-size:66px;font-weight:600;color:rgba(255,255,255,.92);letter-spacing:-.02em}
.date{position:absolute;top:52px;left:0;right:0;text-align:center;font-size:14px;font-weight:600;color:rgba(255,255,255,.8)}
</style></head><body>
<div class="gn">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6"><circle cx="8" cy="8" r="6.2"/><path d="M8 1.8v12.4M3 5.5c3 1.6 7 1.6 10 0" /></svg>
  <span>Store</span><span>Laptops</span><span>Tablets</span><span>Phones</span><span>Watches</span><span>Audio</span><span>Home</span><span>Entertainment</span><span>Accessories</span><span>Support</span>
  <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1.3"><circle cx="6.3" cy="6.3" r="5"/><path d="m10 10 4 4"/></svg>
  <svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1.2"><path d="M1.5 5h11v9.5h-11zM4.5 5V3.8a2.5 2.5 0 0 1 5 0V5"/></svg>
</div>
<div class="ln"><span class="nm">Lumen 17 Pro</span><span class="lk"><span>Overview</span><span>Why Lumen</span><span>Tech Specs</span><span class="buy">Buy</span></span></div>
<div class="hero">
  <div class="eyebrow">Lumen 17 Pro</div>
  <h1>Forged in copper.</h1>
  <div class="price">From $1099 or $45.79/mo. for 24 mo.*</div>
  <div class="ctas"><span class="b">Buy</span><span class="l">Watch the film <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#2997ff" stroke-width="1.4"><circle cx="8" cy="8" r="7"/><path d="M6.5 5.2v5.6L11 8z" fill="#2997ff"/></svg></span></div>
  <div class="stage">
    <div class="glow"></div>
    <div class="ph back"><div class="plateau">
      <div class="lens" style="left:16px;top:12px"></div><div class="lens" style="left:16px;top:80px"></div><div class="lens" style="left:88px;top:46px"></div>
      <div style="position:absolute;right:22px;top:22px;width:18px;height:18px;border-radius:50%;background:radial-gradient(#fff3d8,#c9a070)"></div>
      <div style="position:absolute;right:26px;bottom:26px;width:12px;height:12px;border-radius:50%;background:#2a1a10"></div>
    </div></div>
    <div class="ph front"><div class="screen"><div class="island"></div><div class="date">Saturday, October 24</div><div class="clock">9:41</div>
      <svg style="position:absolute;bottom:0;left:0" width="232" height="240" viewBox="0 0 232 240"><path d="M0 240V140c40-30 80-10 116-40s80-40 116-30v170z" fill="#3a1608" opacity=".55"/><path d="M0 240V180c50-20 100 0 150-20s60-10 82-6v86z" fill="#1d0a04" opacity=".7"/></svg>
    </div></div>
  </div>
</div>
</body></html>

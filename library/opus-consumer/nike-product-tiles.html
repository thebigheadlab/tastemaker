.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}

.im{height:262px;background:#f5f5f5;display:grid;place-items:center;position:relative;overflow:hidden}
.fav{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center}
.sw{display:flex;gap:4px;margin-top:8px}
.sw i{width:28px;height:28px;background:#f5f5f5;display:grid;place-items:center;border-bottom:2px solid transparent}
.sw i.on{border-bottom-color:#111}
.tag{font-size:14px;font-weight:500;margin-top:10px}
.tag.o{color:#d33918}.tag.g{color:#007d48}
.n{font-size:14px;font-weight:500;margin-top:2px}
.c{font-size:14px;color:#707072;margin-top:2px;line-height:19px}
.pr{font-size:14px;font-weight:500;margin-top:6px}
.pr s{color:#707072;font-weight:400;margin-left:6px}

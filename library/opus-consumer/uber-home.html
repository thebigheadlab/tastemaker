<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#fff;font-family:"Inter Tight","Uber Move",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#000;overflow:hidden;-webkit-font-smoothing:antialiased;width:390px;height:844px;position:relative}
.status{height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 40px;font-weight:600;font-size:16px}
.sicons{display:flex;gap:6px;align-items:center}
.seg{display:flex;gap:26px;padding:8px 16px 0;font-size:17px;font-weight:600;color:#757575;border-bottom:1px solid #eee}
.seg span{padding-bottom:10px}
.seg .on{color:#000;border-bottom:3px solid #000}
.where{margin:16px 16px 0;height:56px;border-radius:28px;background:#eee;display:flex;align-items:center;padding:0 8px 0 18px;gap:12px;font-size:19px;font-weight:600}
.where .now{margin-left:auto;background:#fff;border-radius:20px;height:40px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.saved{margin:6px 16px 0}
.s{display:flex;align-items:center;gap:14px;height:64px}
.s+.s{border-top:1px solid #eee}
.s .ic{width:40px;height:40px;border-radius:50%;background:#eee;display:grid;place-items:center;flex:none}
.s b{display:block;font-size:16px;font-weight:600}
.s small{font-size:14px;color:#5e5e5e}
.h{display:flex;justify-content:space-between;align-items:baseline;padding:18px 16px 12px;font-size:20px;font-weight:700}
.h span{font-size:14px;font-weight:600;background:#eee;border-radius:16px;padding:6px 12px}
.sug{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px}
.sg{text-align:center;font-size:13px;font-weight:600}
.sg div{height:72px;background:#f3f3f3;border-radius:12px;display:grid;place-items:center;margin-bottom:6px;position:relative}
.sg em{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#05a357;color:#fff;font-style:normal;font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px}
.ban{margin:22px 16px 0;height:160px;border-radius:14px;background:#0f3d2e;color:#fff;position:relative;overflow:hidden;padding:18px}
.ban b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:26px;width:200px}
.ban span{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;margin-top:14px}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding-top:9px}
.tab div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#757575}
.tab .on{color:#000}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;background:#000;border-radius:3px}
</style></head><body>

  <div class="sg"><div><svg width="36" height="36" viewBox="0 0 36 36"><circle cx="18" cy="18" r="13" fill="#fff" stroke="#000" stroke-width="1.8"/><path d="M18 5v26M5 18h26" stroke="#000" stroke-width="1.2"/><circle cx="18" cy="18" r="5" fill="#276ef1"/></svg></div>Rentals</div>

.tab{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(249,249,249,.94);border-top:.5px solid rgba(0,0,0,.18);display:flex;justify-content:space-around;padding-top:7px}
.tab div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#999}
.tab .on{color:#007aff}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;background:#000;border-radius:3px}

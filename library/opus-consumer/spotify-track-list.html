<style>
html,body{margin:0;height:100%}
*{box-sizing:border-box}
body{background:#121212;font-family:Figtree,"Circular Std",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;width:480px;height:600px;position:relative}
.head{background:linear-gradient(180deg,#2f5f4c 0%,#1d3a2f 60%,#121212 100%);padding:22px 20px 14px}
.h1{display:flex;gap:18px;align-items:flex-end}
.cov{width:112px;height:112px;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.5);background:linear-gradient(135deg,#9ad1a8,#2f7a58);position:relative;overflow:hidden}
.h1 small{font-size:12px;font-weight:600}
.h1 h2{margin:4px 0 8px;font-size:38px;line-height:40px;font-weight:900;letter-spacing:-.04em}
.h1 .by{font-size:13px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:6px}
.h1 .by b{color:#fff;font-weight:700}
.av{width:20px;height:20px;border-radius:50%;background:#e8a14b;color:#121212;font-size:10px;font-weight:800;display:grid;place-items:center}
.acts{display:flex;align-items:center;gap:20px;margin-top:18px}
.play{margin-left:auto;width:52px;height:52px;border-radius:50%;background:#1ed760;display:grid;place-items:center}
.list{padding:2px 12px 0}
.r{display:flex;align-items:center;height:56px;padding:0 8px;border-radius:6px;gap:12px}
.r.on{background:rgba(255,255,255,.1)}
.th{width:40px;height:40px;border-radius:3px;flex:none}
.t{flex:1;min-width:0}
.t b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.on .t b{color:#1ed760}
.t span{font-size:13px;color:#b3b3b3;display:flex;align-items:center;gap:6px;margin-top:2px}
.e{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:2px;background:#b3b3b3;color:#121212;font-size:9px;font-weight:800}
.dl{width:15px;height:15px;border-radius:50%;background:#1ed760;display:inline-grid;place-items:center}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px;margin-right:2px}
.eq i{width:3px;background:#1ed760;border-radius:1px}
</style></head><body>
